<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mando pareja A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  :root {
    --fondo: #020817;
    --fondo2: #071a3d;
    --rojo: #ff2a1f;
    --amarillo: #ffd400;
    --azul: #2f6bff;
    --verde: #8dff00;
    --ambar: #ffc400;
    --tipo: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', Impact, sans-serif;
  }
  body { display: flex; flex-direction: column; background: linear-gradient(180deg, var(--fondo2) 0%, var(--fondo) 55%); color: #fff; font-family: var(--tipo); text-align: center; user-select: none; -webkit-user-select: none; overflow: hidden; }

  /* ===== Pelota de saque ===== */
  .bola { width: .95em; height: .95em; flex: none; visibility: hidden; filter: drop-shadow(0 0 6px #d4ff00); }
  .bola.on { visibility: visible; }
  .bola svg { width: 100%; height: 100%; display: block; }

  /* ===== Tres puntitos + menú desplegable ===== */
  #botonMenu { position: fixed; top: 14px; right: 14px; z-index: 20; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--verde); background: rgba(0,0,0,.75); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; box-shadow: 0 0 10px rgba(141,255,0,.5); padding: 0; }
  #botonMenu span { width: 6px; height: 6px; border-radius: 50%; background: var(--verde); display: block; }
  #fondoMenu { position: fixed; inset: 0; z-index: 21; display: none; }
  #fondoMenu.abierto { display: block; }
  #listaMenu { position: absolute; top: 68px; right: 14px; background: #060d1d; border: 2px solid var(--verde); border-radius: 14px; box-shadow: 0 0 20px rgba(141,255,0,.45); overflow-y: auto; max-height: calc(100vh - 80px); min-width: 260px; max-width: calc(100vw - 28px); }
  #listaMenu button { display: block; width: 100%; text-align: left; padding: 11px 18px; font-size: 1.1rem; font-weight: 700; font-family: inherit; color: #fff; background: transparent; border: none; border-bottom: 1px solid #1b2a4a; cursor: pointer; letter-spacing: 1.5px; }
  #listaMenu button:last-child { border-bottom: none; }
  #listaMenu button:active { background: #12304a; }
  #listaMenu .reiniciar { color: #ff6b6b; }

  /* ===== Ventanas (nombres, saque y logo) ===== */
  .ventana { position: fixed; inset: 0; background: rgba(2,8,23,.95); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; z-index: 30; overflow: auto; }
  .ventana.abierto { display: flex; }
  .ventana h2 { margin: 0 0 6px; color: var(--verde); letter-spacing: 3px; text-shadow: 0 0 10px var(--verde); font-size: 1.6rem; }
  .grupo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(640px, 100%); }
  .grupo label { font-size: .9rem; color: #9db0d0; display: block; text-align: left; margin-bottom: 3px; }
  .grupo input { width: 100%; font-size: 1.3rem; padding: 10px; border-radius: 10px; border: 2px solid var(--verde); background: #000; color: #fff; font-family: inherit; }
  .ventana .cerrar { margin-top: 8px; background: var(--verde); color: #000; font-weight: 800; font-size: 1.3rem; padding: 12px 36px; border: none; border-radius: 12px; cursor: pointer; font-family: inherit; }
  .ventana .secundario { background: transparent; color: #9db0d0; border: 2px solid #34476b; }
  .elegir { display: grid; gap: 10px; width: min(640px, 100%); }
  .elegir button { font-size: 1.4rem; font-weight: 700; padding: 16px 10px; border-radius: 12px; border: 2px solid var(--verde); background: #000; color: #fff; font-family: inherit; text-transform: uppercase; cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
  .elegir button:active { background: #12304a; }
  #vistaLogo { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 18px rgba(141,255,0,.6); background: #000; }

  /* ===== Punto de conexión (verde = sincronizado) ===== */
  #conexion { position: fixed; top: 31px; right: 126px; z-index: 20; width: 10px; height: 10px; border-radius: 50%; background: #ff2a1f; box-shadow: 0 0 6px #ff2a1f; }
  #conexion.ok { background: #16a34a; box-shadow: 0 0 6px #16a34a; }

  /* ===== Botón de micrófono ===== */
  #botonMic { position: fixed; top: 14px; right: 68px; z-index: 20; width: 46px; height: 46px; border-radius: 50%; border: 2px solid #4b5b7a; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  #botonMic svg { width: 24px; height: 24px; fill: #7f90b3; }
  #botonMic.on { border-color: var(--rojo); box-shadow: 0 0 12px rgba(255,42,31,.8); animation: latido 1.4s ease-in-out infinite; }
  #botonMic.on svg { fill: var(--rojo); }
  @keyframes latido { 0%, 100% { box-shadow: 0 0 6px rgba(255,42,31,.6); } 50% { box-shadow: 0 0 18px rgba(255,42,31,1); } }
  #avisoMic { position: fixed; top: 68px; left: 12px; right: 12px; z-index: 22; padding: 8px 12px; border-radius: 12px; background: rgba(0,0,0,.88); border: 2px solid var(--rojo); color: #fff; font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; display: none; }
  #avisoMic.on { display: block; }

  /* ===== Cabecera: logo + mini marcador ===== */
  .cabecera { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 128px 8px 10px; border-bottom: 3px solid var(--verde); box-shadow: 0 4px 14px rgba(141,255,0,.2); }
  .logo { height: 54px; width: 54px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 10px rgba(141,255,0,.55); -webkit-touch-callout: none; touch-action: manipulation; }
  .tablero { border-collapse: collapse; flex: 1; min-width: 0; }
  .tablero th { font-size: .85rem; color: var(--verde); letter-spacing: 1.5px; font-weight: 700; padding: 0 4px; }
  .tablero td { padding: 1px 6px; font-size: 2rem; font-weight: 800; line-height: 1.1; }
  .tablero td.eq { font-size: 1.2rem; width: 1.6em; }
  .tablero tr.fA td { color: #ff5a50; }
  .tablero tr.fB td { color: #5aa0ff; }
  .tablero tr.mio td { background: rgba(141,255,0,.14); }

  .extra { display: none; flex: 0 0 calc(100% + 118px); margin-right: -118px; align-items: center; justify-content: center; gap: 14px; }
  .extra.on { display: flex; }
  .tbMando { display: none; padding: .05em .45em; border-radius: .3em; font-size: 1.5rem; font-weight: 800; letter-spacing: .06em; color: #1a1300; background: var(--ambar); box-shadow: 0 0 12px rgba(255,196,0,.8); animation: pulsoTB 1.2s ease-in-out infinite; flex: none; }
  .tbMando.on { display: inline-block; }
  @keyframes pulsoTB { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .hist { display: flex; flex-direction: row; align-items: baseline; flex-wrap: wrap; justify-content: center; gap: 4px 12px; text-align: center; font-size: 1.15rem; font-weight: 700; color: var(--amarillo); letter-spacing: 1px; line-height: 1.1; }
  .hist small { font-size: .75rem; color: #8fa6cf; font-weight: 600; }
  .hist b { font-weight: 700; white-space: nowrap; }
  .cambio { display: none; width: 40px; height: 40px; flex: none; filter: drop-shadow(0 0 6px var(--verde)); animation: parpadeo 1s infinite; }
  .cambio svg { width: 100%; height: 100%; display: block; }
  @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* ===== Mini marcador por parejas ===== */
  .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; border-bottom: 3px solid #1b2a4a; }
  .caja { padding: 6px 4px 8px; border-radius: 14px; border: 2px solid #1b2a4a; border-top: 5px solid transparent; background: rgba(255,255,255,.04); min-width: 0; }
  .caja.A { border-top-color: #ff2a2a; }
  .caja.B { border-top-color: #2a8bff; }
  .caja.mio { background: rgba(141,255,0,.1); border-color: var(--verde); box-shadow: 0 0 14px rgba(141,255,0,.35); }
  .nombres { display: flex; flex-direction: column; gap: 2px; }
  .nombres div { display: flex; align-items: center; justify-content: flex-start; gap: 6px; font-size: 1.3rem; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; padding: 0 6px; text-transform: uppercase; letter-spacing: .5px; }
  .nombres div span { overflow: hidden; text-overflow: ellipsis; }
  .puntos { position: relative; margin: 6px auto 0; width: 82%; border-radius: 10px; color: #0a0a0a; font-size: 3.6rem; font-weight: 800; line-height: 1.12;
    background: linear-gradient(180deg, #ffffff 0%, #ececec 49%, #bdbdbd 49.5%, #e6e6e6 51%, #f7f7f7 100%); box-shadow: 0 5px 10px rgba(0,0,0,.6); }
  .puntos::before { content: ''; position: absolute; left: 0; right: 0; top: 49.3%; height: 3px; background: rgba(0,0,0,.5); }
  .puntos.ad { font-size: 2.9rem; padding: .08em 0; }

  /* ===== Botones 3D realistas (sin cambios) ===== */
  .mas, .menos { position: relative; border: none; color: #fff; font-family: 'Arial Black', Arial, sans-serif; line-height: 1; cursor: pointer; overflow: hidden; touch-action: manipulation; transition: transform .07s ease, box-shadow .07s ease, filter .07s ease; }
  .mas::before, .menos::before { content: ''; position: absolute; left: 4%; right: 4%; top: 2%; height: 42%; border-radius: 50% 50% 50% 50% / 100% 100% 60% 60%; background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 70%, rgba(255,255,255,0) 100%); pointer-events: none; }
  .mas::after, .menos::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: 3%; height: 14%; border-radius: 50%; background: linear-gradient(0deg, rgba(255,255,255,.22), rgba(255,255,255,0)); pointer-events: none; }

  .mas { width: 100%; height: 100%; margin: 0; border-radius: 22px; font-size: 5.5rem;
    background: radial-gradient(120% 90% at 50% 0%, #6dff9a 0%, #22c55e 28%, #15803d 68%, #0b4f26 100%);
    text-shadow: 0 -3px 0 rgba(255,255,255,.25), 0 6px 8px rgba(0,0,0,.55), 0 0 18px rgba(190,255,210,.35);
    box-shadow:
      inset 0 3px 2px rgba(255,255,255,.65),
      inset 0 -10px 18px rgba(0,40,15,.65),
      inset 6px 0 14px rgba(0,60,25,.35),
      inset -6px 0 14px rgba(0,60,25,.35),
      0 10px 0 #0a3d1c,
      0 14px 0 #062a13,
      0 22px 28px rgba(0,0,0,.85),
      0 0 24px rgba(34,197,94,.35); }
  .mas:active { transform: translateY(8px);
    box-shadow:
      inset 0 3px 2px rgba(255,255,255,.4),
      inset 0 -6px 14px rgba(0,40,15,.7),
      inset 0 10px 22px rgba(0,30,10,.5),
      0 2px 0 #0a3d1c,
      0 4px 0 #062a13,
      0 8px 12px rgba(0,0,0,.8),
      0 0 14px rgba(34,197,94,.25);
    filter: brightness(.93); }
  .menos { width: 100%; height: 100%; margin: 0; border-radius: 22px; font-size: 4.5rem;
    background: radial-gradient(120% 110% at 50% 0%, #ff8a80 0%, #ef4444 30%, #b91c1c 70%, #6b0f0f 100%);
    text-shadow: 0 -2px 0 rgba(255,255,255,.25), 0 4px 6px rgba(0,0,0,.55), 0 0 12px rgba(255,200,200,.3);
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.65),
      inset 0 -7px 12px rgba(70,0,0,.65),
      inset 4px 0 10px rgba(90,0,0,.35),
      inset -4px 0 10px rgba(90,0,0,.35),
      0 7px 0 #7a1010,
      0 10px 0 #4d0a0a,
      0 16px 20px rgba(0,0,0,.85),
      0 0 18px rgba(239,68,68,.3); }
  .menos:active { transform: translateY(6px);
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.4),
      inset 0 -4px 10px rgba(70,0,0,.7),
      inset 0 8px 16px rgba(50,0,0,.5),
      0 1px 0 #7a1010,
      0 3px 0 #4d0a0a,
      0 6px 9px rgba(0,0,0,.8),
      0 0 10px rgba(239,68,68,.2);
    filter: brightness(.93); }

  /* ===== Zona de cámara (suma el punto al acercar la pala) ===== */
  .camara { position: relative; flex: 1; min-height: 0; margin: 12px 12px 18px; border-radius: 22px; overflow: hidden; border: 3px solid var(--verde); background: #040d1c; box-shadow: 0 0 18px rgba(141,255,0,.35); cursor: pointer; transition: background .15s ease, border-color .15s ease; }
  .camara video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .45; }
  .camTexto { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; font-size: 1.6rem; font-weight: 700; letter-spacing: 2px; color: var(--verde); text-shadow: 0 0 10px rgba(0,0,0,.9); pointer-events: none; }
  .camBarra { position: absolute; left: 12px; right: 12px; bottom: 10px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
  .camBarra i { display: block; height: 100%; width: 0; background: var(--verde); }
  .camara.tapando { border-color: var(--amarillo); }
  .camara.punto { background: #22c55e; border-color: #fff; }
  .camara.punto .camTexto { color: #000; text-shadow: none; font-size: 3.4rem; }
  .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 0 12px 28px; height: 120px; flex: none; }
</style>
</head>
<body>

<div class="cabecera">
  <img class="logo" id="logo" src="logo.jpg" alt="Logo" onerror="this.style.display='none'" oncontextmenu="return false">
  <table class="tablero">
    <tr><th></th><th>SETS</th><th>JUEGOS</th><th>PUNTO</th></tr>
    <tr class="fA" id="filaA"><td class="eq">A</td><td id="tsA">0</td><td id="tjA">0</td><td id="tpA">0</td></tr>
    <tr class="fB" id="filaB"><td class="eq">B</td><td id="tsB">0</td><td id="tjB">0</td><td id="tpB">0</td></tr>
  </table>
  <div class="extra" id="extra">
  <div class="tbMando" id="tbMando">T.B.</div>
    <div class="hist" id="hist"></div>
    <div class="cambio" id="cambio">
      <svg viewBox="0 0 100 100" fill="none" stroke="#8dff00" stroke-width="9" stroke-linecap="round">
        <path d="M 22 50 A 28 28 0 0 1 78 50"/>
        <path d="M 78 50 A 28 28 0 0 1 22 50"/>
        <polygon points="66,46 90,46 78,62" fill="#8dff00" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="10,54 34,54 22,38" fill="#8dff00" stroke-width="3" stroke-linejoin="round"/>

    </div>
  </div>
</div>

<div class="mini">
  <div id="cajaA" class="caja A">
    <div class="nombres">
      <div id="nA0"><i class="bola"></i><span></span></div>
      <div id="nA1"><i class="bola"></i><span></span></div>
    </div>
    <div class="puntos" id="puntosA">0</div>
  </div>
  <div id="cajaB" class="caja B">
    <div class="nombres">
      <div id="nB0"><i class="bola"></i><span></span></div>
      <div id="nB1"><i class="bola"></i><span></span></div>
    </div>
    <div class="puntos" id="puntosB">0</div>
  </div>
</div>

<div class="camara" id="camara">
  <video id="video" playsinline muted autoplay></video>
  <div class="camTexto" id="camTexto">TOCA PARA ACTIVAR LA CÁMARA</div>

</div>

<div class="botones">
  <button class="menos" id="menos">−</button>
  <button class="mas" id="mas">+</button>
</div>

<div id="conexion" title="Conexión"></div>
<button id="botonMic" onclick="alternarMic()" aria-label="Micrófono: decir punto">
  <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
</button>
<div id="avisoMic"></div>
<button id="botonMenu" onclick="abrirListaMenu()" aria-label="Menú"><span></span><span></span><span></span></button>

<div id="fondoMenu" onclick="cerrarListaMenu()">
  <div id="listaMenu" onclick="event.stopPropagation()">
    <button onclick="cerrarListaMenu(); abrirNombres()">NOMBRES</button>
    <button onclick="cerrarListaMenu(); abrirSaque(1)">QUIÉN SACA</button>
    <button id="botonCambio" onclick="alternarCambio(); cerrarListaMenu()">CAMBIO DE CANCHA: SÍ</button>
    <button id="botonVoz" onclick="alternarVoz(); cerrarListaMenu()">VOZ: SÍ</button>
    <button id="botonCamara" onclick="alternarCamara(); cerrarListaMenu()">CÁMARA: SÍ</button>
    <button id="botonSens" onclick="alternarSens()">SENSIBILIDAD: ALTA</button>
    <button id="botonMicVol" onclick="alternarMicVol()">VOLUMEN MÍNIMO VOZ: MEDIO</button>

<script>
// ====== CONFIGURACIÓN DE ESTE MANDO ======
const PAREJA = 'A';
const VOZ_DEFECTO = false;   // en los mandos la voz empieza apagada (habla el marcador); se activa desde el menú
// =========================================

// ===== MOTOR COMPARTIDO: marcador y mandos usan exactamente este código =====
// El partido vive en Firebase (/partido). Cada aparato aplica la jugada, y la envía.
// El logo personalizado vive aparte (/logo) para no reenviarlo en cada punto.
const DB_URL = 'https://marcadoroxa-default-rtdb.europe-west1.firebasedatabase.app';
const RUTA = DB_URL + '/partido.json';
const RUTA_LOGO = DB_URL + '/logo.json';
const ESCALA = [0, 15, 30, 40];
const NOMBRES_DEF = { A: ['Jugador 1', 'Jugador 2'], B: ['Jugador 3', 'Jugador 4'] };
const MAX_HIST = 30;

function leerLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function guardarLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function clonar(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }
function otro(p) { return p === 'A' ? 'B' : 'A'; }

function nombresIniciales() {
  try { const g = JSON.parse(leerLocal('nombresPadel')); if (g && g.A && g.B) return g; } catch (e) {}
  return clonar(NOMBRES_DEF);
}

// tb = true mientras se juega el último juego a 6-6 (juego decisivo, se muestra "T.B.")
// ini = hora (ms) en que empezó el partido, la comparten todos los aparatos
function partidoNuevo(nombres, cc) {
  return { v: 0, pts: {A: 0, B: 0}, juegos: {A: 0, B: 0}, sets: {A: 0, B: 0},
           saque: null, tb: false, cambio: false, lados: 0, hist: [], ant: [], ini: 0,
           nombres: nombres, cc: cc, msg: '', dicho: '' };
}

let S = partidoNuevo(nombresIniciales(), leerLocal('cambioCancha') !== 'no');
let vozActiva = leerLocal('vozPadel') ? leerLocal('vozPadel') === 'si' : VOZ_DEFECTO;

// Firebase quita los vacíos (listas [] y null): se rellenan al recibir
function normalizar(d) {
  const par = o => ({ A: (o && o.A) || 0, B: (o && o.B) || 0 });
  const saque = s => s ? { eq: s.eq, jug: par(s.jug) } : null;
  const nom = (x, def) => [ (x && x[0]) || def[0], (x && x[1]) || def[1] ];
  const r = {};
  r.v = d.v || 0;
  r.pts = par(d.pts); r.juegos = par(d.juegos); r.sets = par(d.sets);
  r.saque = saque(d.saque);
  r.tb = !!d.tb;
  r.cambio = !!d.cambio;
  r.lados = d.lados || 0;
  r.ini = d.ini || 0;
  r.ant = Array.isArray(d.ant) ? d.ant : (d.ant ? Object.values(d.ant) : []);
  r.hist = Array.isArray(d.hist) ? d.hist : (d.hist ? Object.values(d.hist) : []);
  r.nombres = { A: nom(d.nombres && d.nombres.A, NOMBRES_DEF.A), B: nom(d.nombres && d.nombres.B, NOMBRES_DEF.B) };
  r.cc = d.cc !== false;
  r.msg = d.msg || '';
  r.dicho = d.dicho || '';
  return r;
}

// ===== Voz (el aparato habla) =====
function hablar(texto) {
  if (!vozActiva || !texto || typeof speechSynthesis === 'undefined') return;
  try {
    if (typeof alHablar === 'function') alHablar();   // el micrófono no debe oír esta voz
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'es-ES';
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ===== Textos =====
function nombrePareja(p) { return S.nombres[p][0] + ' y ' + S.nombres[p][1]; }

// Texto del punto de cada pareja (VENTAJA se muestra como AD donde falta espacio)
// El juego decisivo de 6-6 se cuenta igual que cualquier otro: 15, 30, 40, iguales, ventaja.
function textoPuntos(p) {
  const a = S.pts[p], b = S.pts[otro(p)];
  if (a >= 3 && b >= 3) {
    if (a === b) return '40';
    return a > b ? 'VENTAJA' : '40';
  }
  return String(ESCALA[a]);
}

function frasePuntos() {
  const a = S.pts.A, b = S.pts.B;
  // El tanteo se canta empezando por la pareja que saca (15-0, 0-15...)
  const sc = sacador();
  const p1 = sc ? sc.eq : 'A', p2 = otro(p1);
  const x = S.pts[p1], y = S.pts[p2];
  if (a >= 3 && b >= 3) {
    if (a === b) return 'Iguales';
    return 'Ventaja ' + nombrePareja(a > b ? 'A' : 'B');
  }
  return ESCALA[x] + ' ' + ESCALA[y];
}

// ===== Saque =====
// S.saque = { eq: pareja que saca, jug: { A: jugador (0/1) que saca cuando saca A, B: igual } }
function sacador() {
  const s = S.saque;
  if (!s) return null;
  return { eq: s.eq, j: s.jug[s.eq] };
}

// ===== Jugadas =====
function instantanea() {
  return JSON.stringify({ pts: S.pts, juegos: S.juegos, sets: S.sets, saque: S.saque, tb: S.tb, cambio: S.cambio, lados: S.lados, ant: S.ant });
}

function terminar(msg, dicho) {
  S.v++;
  S.msg = msg;
  S.dicho = dicho;
  refrescar();
  hablar(dicho);
  publicar();
}

// Cambio sin voz (nombres, saque, cambio de cancha sí/no)
function cambiar() {
  S.v++;
  S.dicho = '';
  refrescar();
  publicar();
}

function accionPunto(p) {
  S.hist.push(instantanea());
  if (S.hist.length > MAX_HIST) S.hist.shift();
  if (!S.ini) S.ini = Date.now();            // por si nadie eligió quién saca: empieza con el primer punto
  const q = otro(p);
  let msg = '', dicho = '', cambio = false;
  S.cambio = false;
  S.pts[p]++;

  if (S.pts[p] >= 4 && S.pts[p] - S.pts[q] >= 2) {
    // ===== Gana el juego =====
    const eraDecisivo = S.tb;
    S.pts = {A: 0, B: 0};
    S.juegos[p]++;
    msg = 'JUEGO ' + nombrePareja(p).toUpperCase();
    dicho = 'Juego ' + nombrePareja(p) + '. Juegos, ' + S.juegos.A + ' ' + S.juegos.B;

    // El saque pasa a la otra pareja; quien sacó, la próxima vez sacará su compañero
    if (S.saque) {
      S.saque.jug[S.saque.eq] ^= 1;
      S.saque.eq = otro(S.saque.eq);
    }

    const jp = S.juegos[p], jq = S.juegos[q];
    const total = jp + jq;
    if (eraDecisivo || (jp >= 6 && jp - jq >= 2)) {
      // Gana el set (el juego decisivo de 6-6 lo cierra 7-6)
      S.sets[p]++;
      S.ant.push({ A: S.juegos.A, B: S.juegos.B, tb: eraDecisivo ? 1 : 0 });
      S.juegos = {A: 0, B: 0};
      S.tb = false;
      msg = 'SET ' + nombrePareja(p).toUpperCase();
      dicho = 'Set ' + nombrePareja(p) + '. Sets, ' + S.sets.A + ' ' + S.sets.B;
      if (total % 2 === 1) cambio = true;
    } else if (jp === 6 && jq === 6) {
      // Seis iguales: último juego decisivo
      S.tb = true;
      msg = 'T.B.';
      dicho += '. Tie-break';
    } else if (total % 2 === 1) {
      cambio = true;  // juegos impares: 1, 3, 5, 7, 9, 11
    }
  } else {
    dicho = frasePuntos();
  }

  if (cambio && S.cc) {
    S.cambio = true;
    S.lados++;
    dicho += '. Cambio de cancha';
  }
  terminar(msg, dicho);
}

function deshacer() {
  if (!S.hist.length) return;
  Object.assign(S, JSON.parse(S.hist.pop()));
  terminar('', 'Anulado. ' + frasePuntos());
}

function reiniciar() {
  if (typeof confirm === 'function' && !confirm('¿Reiniciar todo el marcador?')) return;
  const v = S.v + 1;
  guardarLocal('nombresPadel', '');   // olvidar los nombres guardados en este móvil
  S = partidoNuevo(clonar(NOMBRES_DEF), S.cc);
  S.v = v;
  S.dicho = 'Marcador reiniciado';
  refrescar();
  hablar(S.dicho);
  publicar();
  abrirSaque(1);
}

// ===== Cronómetro: cuenta desde que se eligió quién saca =====
function textoCrono() {
  if (!S.ini) return '00:00:00';
  let s = Math.max(0, Math.floor((Date.now() - S.ini) / 1000));
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  const dos = n => (n < 10 ? '0' : '') + n;
  return dos(h) + ':' + dos(m) + ':' + dos(s);
}

// ===== Sincronización con Firebase =====
let enviando = false, pendiente = false, arrancado = false;

function conexion(ok) { if (typeof alConexion === 'function') alConexion(ok); }

function publicar() {
  pendiente = true;
  if (!enviando) enviar();
}

function enviar() {
  enviando = true;
  pendiente = false;
  fetch(RUTA, { method: 'PUT', body: JSON.stringify(S) })
    .then(r => { if (!r.ok) throw new Error('http'); conexion(true); })
    .catch(() => conexion(false))
    .then(() => { enviando = false; if (pendiente) enviar(); });
}

// Al abrir: si el partido no tiene saque elegido, se pregunta quién saca
function arranque() {
  if (arrancado) return;
  arrancado = true;
  if (!S.saque) abrirSaque(1);
}

function recibir(d) {
  if (!d) { arranque(); return; }
  const r = normalizar(d);
  if (r.v > S.v) {
    const hablarlo = arrancado && r.dicho;
    S = r;
    refrescar();
    if (typeof alRecibir === 'function') alRecibir();   // los avisos de otro aparato no cuentan como punto por voz
    if (hablarlo) hablar(r.dicho);
  } else if (r.v < S.v && !enviando) {
    publicar();  // este aparato va por delante (p. ej. jugó sin conexión)
  }
  arranque();
}

function descargar() {
  fetch(RUTA).then(r => r.json()).then(recibir).catch(() => conexion(false));
}

function conectar() {
  let es;
  try { es = new EventSource(RUTA); } catch (e) { return; }
  es.addEventListener('put', ev => {
    conexion(true);
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.path === '/') recibir(m.data); else descargar();
  });
  es.addEventListener('patch', () => descargar());
  es.onerror = () => conexion(false);
}

// Convierte la imagen elegida en un cuadrado de 256 px (ligero y válido para el círculo del logo)
function procesarLogo(archivo, alTerminar) {
  if (!archivo) return;
  const url = URL.createObjectURL(archivo);
  const img = new Image();
  img.onload = () => {
    const T = 256, c = document.createElement('canvas');
    c.width = c.height = T;
    const g = c.getContext('2d');
    g.fillStyle = '#020817';
    g.fillRect(0, 0, T, T);
    const lado = Math.min(img.width, img.height);
    g.drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, T, T);
    URL.revokeObjectURL(url);
    guardarLogo(c.toDataURL('image/jpeg', 0.85));
    if (alTerminar) alTerminar(true);
  };
  img.onerror = () => { URL.revokeObjectURL(url); if (alTerminar) alTerminar(false); };
  img.src = url;
}

function conectarLogo() {
  aplicarLogo();
  fetch(RUTA_LOGO).then(r => r.json()).then(recibirLogo).catch(() => {});
  let es;
  try { es = new EventSource(RUTA_LOGO); } catch (e) { return; }
  es.addEventListener('put', ev => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.path === '/') recibirLogo(m.data);
  });
}

// ===== CÁMARA: al acercar la pala (o cualquier superficie) al objetivo se suma el punto =====
// Se compara cada píxel con cómo se veía antes. Si media pantalla o más cambia de luz de golpe
// (más oscura o más clara, según la pala y el fondo) y se mantiene CAM_TAPADO_MS, cuenta un punto.
// Después hay un descanso (bloqueo compartido con la voz) para no sumar dos veces.
// ==CAM_CORE==
const CAM_W = 32, CAM_H = 24;
const CAM_TAPADO_MS = 200;      // tiempo que debe durar el cambio
const CAM_RELEARN_MS = 4000;    // si el cambio dura mucho, se vuelve a aprender la luz normal
// cambio: un píxel cuenta como cambiado si su luz sube o baja más de esa fracción (y al menos 12 niveles)
// cuanto: fracción de píxeles cambiados necesaria
const SENSIBILIDADES = {
  alta:  { cambio: 0.30, cuanto: 0.50 },
  media: { cambio: 0.40, cuanto: 0.60 },
  baja:  { cambio: 0.50, cuanto: 0.75 }
};

function nuevoCam() { return { base: null, desde: 0, armado: true }; }

// Procesa un fotograma. lum = luz de cada píxel (+1). Devuelve { frac, cubierto, disparo }
function pasoCam(C, lum, ahora, cfg) {
  const n = lum.length;
  if (!C.base) { C.base = Float32Array.from(lum); return { frac: 0, cubierto: false, disparo: false }; }
  let cambiados = 0;
  for (let i = 0; i < n; i++) {
    const dif = Math.abs(lum[i] - C.base[i]);
    if (dif > Math.max(cfg.cambio * C.base[i], 12)) cambiados++;
  }
  const frac = cambiados / n;
  const cubierto = frac >= cfg.cuanto;
  let disparo = false;
  if (!cubierto) {
    for (let i = 0; i < n; i++) C.base[i] += (lum[i] - C.base[i]) * 0.05;   // sigue los cambios lentos de luz
    C.desde = 0;
    C.armado = true;
  } else {
    if (!C.desde) C.desde = ahora;
    if (C.armado && ahora - C.desde >= CAM_TAPADO_MS) { C.armado = false; disparo = true; }
    else if (ahora - C.desde > CAM_RELEARN_MS) { C.base = Float32Array.from(lum); C.desde = 0; C.armado = true; }
  }
  return { frac, cubierto, disparo };
}
// ==/CAM_CORE==

let camActiva = leerLocal('camPadel') !== 'no';
let sens = SENSIBILIDADES[leerLocal('sensPadel')] ? leerLocal('sensPadel') : 'alta';
let camStream = null, camTimer = null, camLum = null, camFlash = null;
let CAM = nuevoCam();
const camCanvas = document.createElement('canvas');
camCanvas.width = CAM_W; camCanvas.height = CAM_H;
const camCtx = camCanvas.getContext('2d', { willReadFrequently: true });

function textoCam(t) { $('camTexto').textContent = t; }

async function iniciarCamara() {
  if (!camActiva || camStream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    textoCam('LA CÁMARA NECESITA HTTPS'); return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } }, audio: false
    });
    const v = $('video');
    v.srcObject = camStream;
    await v.play();
    CAM = nuevoCam();
    camTimer = setInterval(analizarCamara, 50);
    textoCam('ACERCA LA PALA');
  } catch (e) {
    camStream = null;
    textoCam('SIN PERMISO DE CÁMARA · TOCA PARA REINTENTAR');
  }
}

function pararCamara() {
  if (camTimer) { clearInterval(camTimer); camTimer = null; }
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  $('video').srcObject = null;
  CAM = nuevoCam();
  $('camara').classList.remove('tapando');
  $('camNivel').style.width = '0';
}

function analizarCamara() {
  const v = $('video');
  if (v.readyState < 2) return;
  camCtx.drawImage(v, 0, 0, CAM_W, CAM_H);
  const d = camCtx.getImageData(0, 0, CAM_W, CAM_H).data;
  const n = CAM_W * CAM_H;
  if (!camLum) camLum = new Float32Array(n);
  for (let i = 0; i < n; i++) camLum[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2] + 1;
  const r = pasoCam(CAM, camLum, performance.now(), SENSIBILIDADES[sens]);
  $('camNivel').style.width = Math.min(100, Math.round(r.frac * 100)) + '%';
  $('camara').classList.toggle('tapando', r.cubierto);
  if (r.disparo) puntoAuto('cámara');
}

function alternarCamara() {
  camActiva = !camActiva;
  guardarLocal('camPadel', camActiva ? 'si' : 'no');
  if (camActiva) { textoCam('ACTIVANDO CÁMARA...'); iniciarCamara(); }
  else { pararCamara(); textoCam('CÁMARA APAGADA · TOCA PARA ACTIVAR'); }
  pintarMenu();
}

function alternarSens() {
  const orden = ['baja', 'media', 'alta'];
  sens = orden[(orden.indexOf(sens) + 1) % orden.length];
  guardarLocal('sensPadel', sens);
  pintarMenu();
}

$('camara').addEventListener('click', () => {
  if (!camActiva) { camActiva = true; guardarLocal('camPadel', 'si'); pintarMenu(); }
  if (!camStream) { textoCam('ACTIVANDO CÁMARA...'); iniciarCamara(); }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const t = camStream && camStream.getVideoTracks()[0];
  if (camStream && (!t || t.readyState === 'ended')) { pararCamara(); iniciarCamara(); }
});

if (camActiva) iniciarCamara(); else textoCam('CÁMARA APAGADA · TOCA PARA ACTIVAR');


// ===== PUNTO AUTOMÁTICO: bloqueo común (cámara + voz) para no sumar dos veces =====
const AUTO_BLOQUEO_MS = 2000;
let autoBloqueoHasta = 0;

function puntoAuto(origen) {
  const ahora = performance.now();
  if (ahora < autoBloqueoHasta) return false;
  // No sumar si hay una ventana o el menú abiertos
  if (document.querySelector('.ventana.abierto') || $('fondoMenu').classList.contains('abierto')) return false;
  autoBloqueoHasta = ahora + AUTO_BLOQUEO_MS;
  if (navigator.vibrate) navigator.vibrate(60);
  accionPunto(parejaActual());
  const c = $('camara');
  c.classList.add('punto');
  textoCam('¡PUNTO!');
  clearTimeout(camFlash);
  camFlash = setTimeout(() => { c.classList.remove('punto'); textoCam(camStream ? 'ACERCA LA PALA' : 'CÁMARA APAGADA · TOCA PARA ACTIVAR'); }, 600);
  return true;
}

// La voz del propio aparato y los avisos que llegan de otro aparato ("anulado", "juego"...) no cuentan
function alHablar() { autoBloqueoHasta = Math.max(autoBloqueoHasta, performance.now() + 3500); }
function alRecibir() { autoBloqueoHasta = Math.max(autoBloqueoHasta, performance.now() + 2500); }

// ===== MICRÓFONO: al oír "punto" suma un punto (solo si se oye fuerte y cerca) =====
// El reconocimiento de voz del navegador (Chrome) entiende la palabra; un medidor de volumen aparte
// descarta lo que suena flojo (el equipo de enfrente, a más de ~3 m). El volumen mínimo se ajusta en el menú.
const MIC_UMBRALES = { bajo: 0.012, medio: 0.03, alto: 0.07 };   // volumen (RMS) mínimo
const MIC_VENTANA_MS = 1800;                                     // se mira el volumen de justo antes de oír la palabra
let micActivo = false, micVol = MIC_UMBRALES[leerLocal('micVolPadel')] ? leerLocal('micVolPadel') : 'medio';
let micRec = null, micStream = null, micAudioCtx = null, micAnalizador = null, micTimer = null;
let micHistorial = [], micVisto = 0, micSesion = 0, micContadas = {}, micTextoAviso = null;

function avisoMic(t, ms) {
  const a = $('avisoMic');
  a.textContent = t; a.classList.add('on');
  clearTimeout(micTextoAviso);
  micTextoAviso = setTimeout(() => a.classList.remove('on'), ms || 2200);
}

function pintarMic() {
  $('botonMic').classList.toggle('on', micActivo);
  $('botonMic').setAttribute('aria-pressed', micActivo ? 'true' : 'false');
}

function volumenReciente() {
  const ahora = performance.now();
  micHistorial = micHistorial.filter(m => ahora - m.t <= MIC_VENTANA_MS);
  return micHistorial.reduce((mx, m) => Math.max(mx, m.v), 0);
}

function medirVolumen() {
  if (!micAnalizador) return;
  const buf = new Float32Array(micAnalizador.fftSize);
  micAnalizador.getFloatTimeDomainData(buf);
  let s = 0;
  for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
  const v = Math.sqrt(s / buf.length);
  micHistorial.push({ t: performance.now(), v });
  if (v > micVisto) micVisto = v;
}

async function iniciarMedidor() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false });
    const AC = window.AudioContext || window.webkitAudioContext;
    micAudioCtx = new AC();
    const fuente = micAudioCtx.createMediaStreamSource(micStream);
    micAnalizador = micAudioCtx.createAnalyser();
    micAnalizador.fftSize = 1024;
    fuente.connect(micAnalizador);
    micTimer = setInterval(medirVolumen, 60);
  } catch (e) { micAnalizador = null; }   // sin medidor: se acepta la palabra sin filtrar por volumen
}

function pararMedidor() {
  clearInterval(micTimer); micTimer = null;
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (micAudioCtx) { try { micAudioCtx.close(); } catch (e) {} micAudioCtx = null; }
  micAnalizador = null; micHistorial = []; micVisto = 0;
}

function oirPunto(clave) {
  if (micContadas[clave]) return;           // una frase cuenta una sola vez aunque llegue en trozos
  micContadas[clave] = true;
  // Filtro de volumen (solo si el medidor está recibiendo sonido de verdad)
  if (micAnalizador && micVisto > 0) {
    if (volumenReciente() < MIC_UMBRALES[micVol]) { avisoMic('"PUNTO" MUY FLOJO · IGNORADO'); return; }
  }
  puntoAuto('voz');
}

function arrancarReconocimiento() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { avisoMic('ESTE NAVEGADOR NO ENTIENDE VOZ · USA CHROME', 4000); micActivo = false; guardarLocal('micPadel', 'no'); pintarMic(); return false; }
  const sesion = ++micSesion;
  micContadas = {};
  micRec = new SR();
  micRec.lang = 'es-ES';
  micRec.continuous = true;
  micRec.interimResults = true;
  micRec.maxAlternatives = 1;
  micRec.onresult = ev => {
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const texto = (ev.results[i][0].transcript || '').toLowerCase();
      if (/\bpunto\b/.test(texto) && !/anulad/.test(texto)) oirPunto(sesion + ':' + i);
    }
  };
  micRec.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      avisoMic('SIN PERMISO DE MICRÓFONO', 3500);
      micActivo = false; guardarLocal('micPadel', 'no'); pararMedidor(); pintarMic();
    }
  };
  micRec.onend = () => {                     // Chrome corta el reconocimiento tras un silencio: se reanuda solo
    if (micActivo && sesion === micSesion) setTimeout(() => { if (micActivo) arrancarReconocimiento(); }, 250);
  };
  try { micRec.start(); } catch (e) {}
  return true;
}

async function activarMic() {
  micActivo = true;
  guardarLocal('micPadel', 'si');
  pintarMic();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { avisoMic('EL MICRÓFONO NECESITA HTTPS', 3500); micActivo = false; pintarMic(); return; }
  if (!arrancarReconocimiento()) return;
  iniciarMedidor();
  avisoMic('MICRÓFONO ACTIVO · DI "PUNTO"');
}

function desactivarMic() {
  micActivo = false;
  guardarLocal('micPadel', 'no');
  micSesion++;
  if (micRec) { try { micRec.onend = null; micRec.abort(); } catch (e) {} micRec = null; }
  pararMedidor();
  pintarMic();
  avisoMic('MICRÓFONO APAGADO');
}

function alternarMic() { micActivo ? desactivarMic() : activarMic(); }

function alternarMicVol() {
  const orden = ['bajo', 'medio', 'alto'];
  micVol = orden[(orden.indexOf(micVol) + 1) % orden.length];
  guardarLocal('micVolPadel', micVol);
  pintarMenu();
}

// El micrófono empieza apagado: el navegador exige un toque del usuario para dar permiso
pintarMic();


$('mas').addEventListener('click', () => {
  if (navigator.vibrate) navigator.vibrate(60);
  accionPunto(parejaActual());
});
$('menos').addEventListener('click', () => {
  if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
  deshacer();
});

iniciarMotor();
</script>
