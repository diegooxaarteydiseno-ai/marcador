<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mando pareja A</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #000; color: #fff; font-family: 'Arial Black', Arial, sans-serif; text-align: center; user-select: none; }

  .cabecera { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #111; border-bottom: 3px solid #333; }
  .logo { height: 48px; width: 48px; border-radius: 50%; object-fit: cover; }
  .titulo { font-size: 1.3rem; letter-spacing: 3px; flex: 1; }
  .estado { font-size: 0.8rem; color: #888; }
  .estado.ok { color: #16a34a; }

  .mini { display: grid; grid-template-columns: 1fr 1fr; background: #111; border-bottom: 3px solid #333; }
  .mini div { padding: 8px 4px; }
  .mini .nombre { font-size: 0.9rem; letter-spacing: 3px; color: #888; }
  .mini .puntos { font-size: 3rem; line-height: 1; }
  .mini .detalle { font-size: 0.95rem; color: #ccc; margin-top: 4px; }
  .cA { color: #ff2a2a; }
  .cB { color: #2a8bff; }
  .mio { background: #1c1c1c; }

  .mas { flex: 1; margin: 12px; border: none; border-radius: 24px; background: #16a34a; color: #fff; font-size: 9rem; line-height: 1; font-family: inherit; cursor: pointer; }
  .mas:active { background: #15803d; transform: scale(0.98); }
  .menos { margin: 0 12px 16px; height: 70px; border: none; border-radius: 16px; background: #dc2626; color: #fff; font-size: 3rem; line-height: 1; font-family: inherit; cursor: pointer; }
  .menos:active { background: #b91c1c; }
</style>
</head>
<body>

<div class="cabecera">
  <img class="logo" src="logo.jpg" alt="Logo" onerror="this.style.display='none'">
  <div class="titulo cA">MANDO PAREJA A</div>
  <div class="estado" id="estado">sin conexión</div>
</div>

<div class="mini">
  <div id="cajaA" class="mio">
    <div class="nombre cA">PAREJA A</div>
    <div class="puntos cA" id="puntosA">0</div>
    <div class="detalle">Juegos <b id="juegosA">0</b> · Sets <b id="setsA">0</b></div>
  </div>
  <div id="cajaB">
    <div class="nombre cB">PAREJA B</div>
    <div class="puntos cB" id="puntosB">0</div>
    <div class="detalle">Juegos <b id="juegosB">0</b> · Sets <b id="setsB">0</b></div>
  </div>
</div>

<button class="mas" id="mas">+</button>
<button class="menos" id="menos">−</button>

<script>
// ====== CONFIGURACIÓN ======
const DB_URL = 'https://marcadoroxa-default-rtdb.europe-west1.firebasedatabase.app';   // ej: https://marcador-oxa-default-rtdb.europe-west1.firebasedatabase.app
const PAREJA = 'A';
// ===========================

const el = id => document.getElementById(id);

function enviar(tipo) {
  if (navigator.vibrate) navigator.vibrate(tipo === 'mas' ? 60 : [40, 40, 40]);
  const cmd = { pareja: PAREJA, tipo: tipo, id: Date.now() + '-' + Math.random().toString(36).slice(2, 8) };
  fetch(DB_URL + '/comando.json', { method: 'PUT', body: JSON.stringify(cmd) })
    .catch(() => { el('estado').textContent = 'error al enviar'; el('estado').classList.remove('ok'); });
}

el('mas').addEventListener('click', () => enviar('mas'));
el('menos').addEventListener('click', () => enviar('menos'));

function pintar(e) {
  if (!e) return;
  el('puntosA').textContent = e.textoA;
  el('puntosB').textContent = e.textoB;
  el('juegosA').textContent = e.juegos.A;
  el('juegosB').textContent = e.juegos.B;
  el('setsA').textContent = e.sets.A;
  el('setsB').textContent = e.sets.B;
}

function conectar() {
  const es = new EventSource(DB_URL + '/estado.json');
  es.addEventListener('put', ev => {
    el('estado').textContent = 'conectado';
    el('estado').classList.add('ok');
    pintar(JSON.parse(ev.data).data);
  });
  es.onerror = () => {
    el('estado').textContent = 'reconectando…';
    el('estado').classList.remove('ok');
  };
}
conectar();

// Mantener la pantalla encendida
async function pantallaEncendida() {
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
}
pantallaEncendida();
document.addEventListener('visibilitychange', () => { if (!document.hidden) pantallaEncendida(); });
</script>
</body>
</html>
