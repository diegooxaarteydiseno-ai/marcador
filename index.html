<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Padel Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  :root {
    --fondo: #020817;
    --fondo2: #071a3d;
    --verde: #8dff00;
    --celeste: #3d9bff;
    --ambar: #ffc400;
    --tipo: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', Impact, sans-serif;
  }
  body { display: flex; flex-direction: column; background: #000; color: #fff; font-family: var(--tipo); text-align: center; overflow: hidden; }

  /* ===== Pelota de saque ===== */
  .bola { width: .9em; height: .9em; flex: none; visibility: hidden; filter: drop-shadow(0 0 5px #d4ff00); }
  .bola.on { visibility: visible; }
  .bola svg { width: 100%; height: 100%; display: block; }

  /* ===== Tres puntitos + menú desplegable ===== */
  #botonMenu { position: fixed; top: 14px; right: 14px; z-index: 20; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--verde); background: rgba(0,0,0,.75); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; box-shadow: 0 0 10px rgba(141,255,0,.5); padding: 0; }
  #botonMenu span { width: 6px; height: 6px; border-radius: 50%; background: var(--verde); display: block; }
  #fondoMenu { position: fixed; inset: 0; z-index: 21; display: none; }
  #fondoMenu.abierto { display: block; }
  #listaMenu { position: absolute; top: 68px; right: 14px; background: #060d1d; border: 2px solid var(--verde); border-radius: 14px; box-shadow: 0 0 20px rgba(141,255,0,.45); overflow-y: auto; max-height: calc(100vh - 80px); min-width: 260px; max-width: calc(100vw - 28px); }
  #listaMenu button { display: block; width: 100%; text-align: left; padding: 11px 18px; font-size: 1.1rem; font-family: inherit; font-weight: 700; color: #fff; background: transparent; border: none; border-bottom: 1px solid #1b2a4a; cursor: pointer; letter-spacing: 1.5px; }
  #listaMenu button:last-child { border-bottom: none; }
  #listaMenu button:active { background: #12304a; }
  #listaMenu .reiniciar { color: #ff6b6b; }

  /* ===== Ventanas (nombres y saque) ===== */
  .ventana { position: fixed; inset: 0; background: rgba(2,8,23,.95); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; z-index: 30; overflow: auto; }
  .ventana.abierto { display: flex; }
  .ventana h2 { margin: 0 0 6px; color: var(--verde); letter-spacing: 3px; text-shadow: 0 0 10px var(--verde); font-size: 1.6rem; }
  .grupo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(640px, 100%); }
  .grupo label { font-size: .9rem; color: #9db0d0; display: block; text-align: left; margin-bottom: 3px; }
  .grupo input { width: 100%; font-size: 1.3rem; padding: 10px; border-radius: 10px; border: 2px solid var(--verde); background: #000; color: #fff; font-family: inherit; }
  .ventana .cerrar { margin-top: 8px; background: var(--verde); color: #000; font-weight: 800; font-size: 1.3rem; padding: 12px 36px; border: none; border-radius: 12px; cursor: pointer; font-family: inherit; }
  .ventana .secundario { background: transparent; color: #9db0d0; border: 2px solid #34476b; }
  .elegir { display: grid; gap: 10px; width: min(640px, 100%); }
  .elegir button { font-size: 1.4rem; font-weight: 700; padding: 16px 10px; border-radius: 12px; border: 2px solid var(--verde); background: #000; color: #fff; font-family: inherit; text-transform: uppercase; cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
  .elegir button:active { background: #12304a; }

  /* ===== Punto de conexión (verde = sincronizado) ===== */
  #conexion { position: fixed; top: 31px; right: 68px; z-index: 20; width: 10px; height: 10px; border-radius: 50%; background: #ff2a1f; box-shadow: 0 0 6px #ff2a1f; }
  #conexion.ok { background: #16a34a; box-shadow: 0 0 6px #16a34a; }

  /* ===== Marcador profesional (horizontal) ===== */
  .panel {
    flex: 1; margin: 6px; min-height: 0; position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 1.2vh 2.2vw 1vh;
    background:
      radial-gradient(120% 90% at 50% 0%, #0c2a63 0%, rgba(12,42,99,0) 60%),
      linear-gradient(180deg, var(--fondo2) 0%, var(--fondo) 70%);
    border: 4px solid var(--verde); border-radius: 22px;
    box-shadow: 0 0 8px var(--verde), 0 0 26px rgba(141,255,0,.5), inset 0 0 28px rgba(141,255,0,.18), inset 0 0 70px rgba(0,0,0,.65);
  }
  .panel::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(160deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 32%); }

  /* Cabecera */
  .cab { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; flex: none; height: 24vh; }
  .cab-izq { display: flex; align-items: center; justify-content: flex-start; }
  .cab-der { display: flex; align-items: center; justify-content: flex-end; gap: 1.4vw; padding-right: 3.4vw; }
  .logo { height: 18vh; width: 18vh; border-radius: 50%; object-fit: cover; box-shadow: 0 0 14px rgba(141,255,0,.6); border: 3px solid var(--verde); }
  .cab-centro { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
  /* Número de pista suelto, sin círculo */
  .pista { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding-left: 1.2vw; line-height: 1; }
  .pista small { font-size: min(3.2vh, 1.9vw); font-weight: 700; letter-spacing: .25em; color: var(--verde); text-shadow: 0 0 8px rgba(141,255,0,.5); }
  .pista b { font-size: min(11vh, 7vw); font-weight: 800; color: #fff; text-shadow: 0 0 12px rgba(255,255,255,.35); }
  .subtitulo { font-size: min(3.7vh, 2.2vw); font-weight: 700; letter-spacing: .09em; color: var(--verde); text-transform: uppercase; min-height: 1.2em; margin-top: .6vh; white-space: nowrap; }
  .tb { display: none; align-items: center; justify-content: center; padding: .1em .55em; border-radius: .35em; font-size: min(8vh, 4.6vw); font-weight: 800; letter-spacing: .08em; color: #1a1300; background: var(--ambar); box-shadow: 0 0 14px rgba(255,196,0,.85), 0 0 34px rgba(255,196,0,.45); animation: pulsoTB 1.2s ease-in-out infinite; }
  .tb.on { display: inline-flex; }
  @keyframes pulsoTB { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .cambio { display: none; height: 11vh; aspect-ratio: 1 / 1; filter: drop-shadow(0 0 8px var(--verde)) drop-shadow(0 0 18px var(--verde)); animation: parpadeo 1s infinite; }
  .cambio svg { width: 100%; height: 100%; display: block; }
  @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* Cuerpo: nombres | punto | sets */
  .cuerpo { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr var(--wPunto) var(--wSets); grid-template-rows: 4.2vh 1fr 1fr; gap: 0 1.4vw;
    --wPunto: min(40vh, 24vw); --wSets: calc(var(--n, 3) * min(17vh, 10.5vw)); }
  .cabSet { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); align-items: end; font-size: min(3.3vh, 2vw); font-weight: 700; letter-spacing: .12em; color: var(--verde); text-shadow: 0 0 8px rgba(141,255,0,.55); }
  .cabSet div { white-space: nowrap; }
  .cabSet .tbmini { display: block; color: var(--ambar); text-shadow: none; font-size: .8em; line-height: 1; }

  .equipo { position: relative; display: flex; flex-direction: column; justify-content: center; gap: .6vh; padding: 0 3vw 0 1.6vw; margin: .9vh 0; cursor: pointer; user-select: none; text-align: left;
    background: linear-gradient(90deg, rgba(255,255,255,.09), rgba(255,255,255,.02) 70%, rgba(255,255,255,0));
    clip-path: polygon(0 0, 100% 0, calc(100% - 3.2vh) 100%, 0 100%);
    min-width: 0; }
  .equipo::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--verde), rgba(141,255,0,.2)); box-shadow: 0 0 10px var(--verde); }
  .equipo div { display: flex; align-items: center; gap: .5em; font-size: min(6.8vh, 3.6vw); font-weight: 800; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; line-height: 1.05; text-shadow: 0 2px 0 rgba(0,0,0,.55); }
  .equipo div span { overflow: hidden; text-overflow: ellipsis; }

  /* Tarjeta blanca de punto (efecto marcador de cartas) */
  .punto { position: relative; margin: .9vh 0; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; overflow: hidden;
    border-radius: 1.2vh; color: #0a0a0a; font-weight: 800; line-height: 1;
    font-size: min(27vh, 16vw);
    background: linear-gradient(180deg, #ffffff 0%, #ececec 49.2%, #bdbdbd 49.4%, #e6e6e6 50.6%, #f7f7f7 100%);
    box-shadow: 0 .8vh 2vh rgba(0,0,0,.75), inset 0 0 1.4vh rgba(0,0,0,.18); }
  .punto::before { content: ''; position: absolute; left: 0; right: 0; top: 49.4%; height: .5vh; background: rgba(0,0,0,.55); }
  .punto span { position: relative; z-index: 1; letter-spacing: -.01em; transform: translateY(-.02em); }
  .punto.ad { font-size: min(21vh, 12.6vw); }

  /* Columnas de sets */
  .sets { margin: .9vh 0; display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); }
  .sets div { display: flex; align-items: center; justify-content: center; font-size: min(18vh, 10.8vw); font-weight: 800; line-height: 1; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,.35); }
  .sets div.futuro { color: var(--celeste); text-shadow: 0 0 10px rgba(61,155,255,.35); }
  .sets div.actual { text-shadow: 0 0 16px rgba(141,255,0,.8), 0 0 4px #fff; }
  .sets div.gana { color: #fff; }
  .sets div.pierde { color: #b7c3dc; text-shadow: none; }

  /* Pie: cronómetro */
  .pie { flex: none; height: 9vh; display: flex; align-items: center; justify-content: space-between; border-top: 3px solid var(--verde); box-shadow: 0 -4px 14px rgba(141,255,0,.25); margin-top: .6vh; padding: 0 1vw; }
  .marca { font-size: min(4vh, 2.3vw); font-weight: 700; letter-spacing: .3em; color: #8fa6cf; text-transform: uppercase; }
  .tiempo { display: flex; align-items: baseline; gap: .8vw; }
  .tiempo small { font-size: min(3.2vh, 1.9vw); font-weight: 700; letter-spacing: .2em; color: var(--verde); }
  .tiempo b { font-size: min(7.4vh, 4.4vw); font-weight: 800; letter-spacing: .06em; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255,255,255,.4); }

  /* ===== Aviso para girar el móvil ===== */
  #girar { position: fixed; inset: 0; background: #000; z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: var(--verde); font-size: 1.8rem; font-weight: 700; letter-spacing: 3px; padding: 20px; text-shadow: 0 0 12px var(--verde); }
  #girar .telefono { width: 60px; height: 100px; border: 5px solid var(--verde); border-radius: 12px; animation: girarTel 2.2s infinite ease-in-out; box-shadow: 0 0 14px var(--verde); }
  @keyframes girarTel { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { #girar { display: flex; } }
</style>
</head>
<body>

<div class="panel">
  <div class="cab">
    <div class="cab-izq"><div class="pista"><small>PISTA</small><b id="pistaNum"></b></div></div>
    <div class="cab-centro">
      <img class="logo" id="logo" src="logo.jpg" alt="Padel Pulse" onerror="this.style.display='none'">
      <div class="subtitulo" id="subtitulo">&nbsp;</div>
    </div>
    <div class="cab-der">
      <div class="tb" id="tb">T.B.</div>
      <div class="cambio" id="cambio">
        <svg viewBox="0 0 100 100" fill="none" stroke="#8dff00" stroke-width="9" stroke-linecap="round">
          <path d="M 22 50 A 28 28 0 0 1 78 50"/>
          <path d="M 78 50 A 28 28 0 0 1 22 50"/>
          <polygon points="66,46 90,46 78,62" fill="#8dff00" stroke-width="3" stroke-linejoin="round"/>
          <polygon points="10,54 34,54 22,38" fill="#8dff00" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="cuerpo" id="cuerpo">
    <div></div><div></div><div class="cabSet" id="cabSet"></div>

    <div class="equipo" onclick="accionPunto('A')">
      <div id="nA0"><i class="bola"></i><span></span></div>
      <div id="nA1"><i class="bola"></i><span></span></div>
    </div>
    <div class="punto" id="puntosA" onclick="accionPunto('A')"><span>0</span></div>
    <div class="sets" id="setsA"></div>

    <div class="equipo" onclick="accionPunto('B')">
      <div id="nB0"><i class="bola"></i><span></span></div>
      <div id="nB1"><i class="bola"></i><span></span></div>
    </div>
    <div class="punto" id="puntosB" onclick="accionPunto('B')"><span>0</span></div>
    <div class="sets" id="setsB"></div>
  </div>

  <div class="pie">
    <span class="marca">Padel Pulse</span>
    <span class="tiempo"><small>TIEMPO</small><b id="crono">00:00:00</b></span>
  </div>
</div>

<div id="conexion" title="Conexión"></div>
<button id="botonMenu" onclick="abrirListaMenu()" aria-label="Menú"><span></span><span></span><span></span></button>

<div id="fondoMenu" onclick="cerrarListaMenu()">
  <div id="listaMenu" onclick="event.stopPropagation()">
    <button onclick="cerrarListaMenu(); abrirNombres()">NOMBRES</button>
    <button onclick="cerrarListaMenu(); abrirSaque(1)">QUIÉN SACA</button>
    <button id="botonCambio" onclick="alternarCambio(); cerrarListaMenu()">CAMBIO DE CANCHA: SÍ</button>
    <button id="botonVoz" onclick="alternarVoz(); cerrarListaMenu()">VOZ: SÍ</button>
    <button id="botonPista" onclick="cerrarListaMenu(); abrirPista()">PISTA · CAMBIAR</button>
    <button id="botonPantalla" onclick="pantallaCompleta(); cerrarListaMenu()">PANTALLA COMPLETA</button>
    <button onclick="deshacer(); cerrarListaMenu()">DESHACER</button>
    <button class="reiniciar" onclick="cerrarListaMenu(); reiniciar()">REINICIAR</button>
  </div>
</div>

<div id="menu" class="ventana">
  <h2>NOMBRES</h2>
  <div class="grupo">
    <div><label>Pareja A · jugador 1</label><input id="iA1" maxlength="14"></div>
    <div><label>Pareja B · jugador 1</label><input id="iB1" maxlength="14"></div>
    <div><label>Pareja A · jugador 2</label><input id="iA2" maxlength="14"></div>
    <div><label>Pareja B · jugador 2</label><input id="iB2" maxlength="14"></div>
  </div>
  <button class="cerrar" onclick="guardarNombres()">GUARDAR</button>
</div>

<div id="ventanaPista" class="ventana">
  <h2>ELEGIR PISTA</h2>
  <div class="elegir" id="opcionesPista"></div>
  <button class="cerrar secundario" id="cancelarPista" onclick="cerrarPista()">CANCELAR</button>
</div>

<div id="ventanaSaque" class="ventana">
  <h2 id="tituloSaque">¿QUIÉN SACA PRIMERO?</h2>
  <div class="elegir" id="opcionesSaque"></div>
  <button class="cerrar secundario" onclick="cerrarSaque()">CANCELAR</button>
</div>

<div id="girar"><div class="telefono"></div>GIRA EL MÓVIL A HORIZONTAL</div>

<script>
const VOZ_DEFECTO = true;   // el marcador es el que habla por defecto

// ===== MOTOR COMPARTIDO: marcador y mandos usan exactamente este código =====
// El partido vive en Firebase (/partido). Cada aparato aplica la jugada, y la envía.
// El logo personalizado vive aparte (/logo) para no reenviarlo en cada punto.
function leerLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function guardarLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function clonar(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }
function otro(p) { return p === 'A' ? 'B' : 'A'; }
const DB_URL = 'https://marcadoroxa-default-rtdb.europe-west1.firebasedatabase.app';
const RUTA_LOGO = DB_URL + '/logo.json';            // el logo es común a todas las pistas
const PISTAS = 5;                                    // cada pista tiene su propio partido: /pistas/N/partido
function rutaDe(n) { return DB_URL + '/pistas/' + n + '/partido.json'; }
let PISTA = parseInt(leerLocal('pistaPadel'), 10) || 0;
if (PISTA < 1 || PISTA > PISTAS) PISTA = 0;
let RUTA = PISTA ? rutaDe(PISTA) : '';
const ESCALA = [0, 15, 30, 40];
const NOMBRES_DEF = { A: ['Jugador 1', 'Jugador 2'], B: ['Jugador 3', 'Jugador 4'] };
const MAX_HIST = 30;


function nombresIniciales() {
  try { const g = JSON.parse(leerLocal('nombresPadel')); if (g && g.A && g.B) return g; } catch (e) {}
  return clonar(NOMBRES_DEF);
}

// tb = true mientras se juega el último juego a 6-6 (juego decisivo, se muestra "T.B.")
// ini = hora (ms) en que empezó el partido, la comparten todos los aparatos
function partidoNuevo(nombres, cc) {
  return { v: 0, pts: {A: 0, B: 0}, juegos: {A: 0, B: 0}, sets: {A: 0, B: 0},
           saque: null, tb: false, cambio: false, lados: 0, hist: [], ant: [], ini: 0,
           nombres: nombres, cc: cc, msg: '', dicho: '' };
}

let S = partidoNuevo(nombresIniciales(), leerLocal('cambioCancha') !== 'no');
let vozActiva = leerLocal('vozPadel') ? leerLocal('vozPadel') === 'si' : VOZ_DEFECTO;

// Firebase quita los vacíos (listas [] y null): se rellenan al recibir
function normalizar(d) {
  const par = o => ({ A: (o && o.A) || 0, B: (o && o.B) || 0 });
  const saque = s => s ? { eq: s.eq, jug: par(s.jug) } : null;
  const nom = (x, def) => [ (x && x[0]) || def[0], (x && x[1]) || def[1] ];
  const r = {};
  r.v = d.v || 0;
  r.pts = par(d.pts); r.juegos = par(d.juegos); r.sets = par(d.sets);
  r.saque = saque(d.saque);
  r.tb = !!d.tb;
  r.cambio = !!d.cambio;
  r.lados = d.lados || 0;
  r.ini = d.ini || 0;
  r.ant = Array.isArray(d.ant) ? d.ant : (d.ant ? Object.values(d.ant) : []);
  r.hist = Array.isArray(d.hist) ? d.hist : (d.hist ? Object.values(d.hist) : []);
  r.nombres = { A: nom(d.nombres && d.nombres.A, NOMBRES_DEF.A), B: nom(d.nombres && d.nombres.B, NOMBRES_DEF.B) };
  r.cc = d.cc !== false;
  r.msg = d.msg || '';
  r.dicho = d.dicho || '';
  return r;
}

// ===== Voz (el aparato habla) =====
function hablar(texto) {
  if (!vozActiva || !texto || typeof speechSynthesis === 'undefined') return;
  try {
    if (typeof alHablar === 'function') alHablar();   // el micrófono no debe oír esta voz
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'es-ES';
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ===== Textos =====
function nombrePareja(p) { return S.nombres[p][0] + ' y ' + S.nombres[p][1]; }

// Texto del punto de cada pareja (VENTAJA se muestra como AD donde falta espacio)
// El juego decisivo de 6-6 se cuenta igual que cualquier otro: 15, 30, 40, iguales, ventaja.
function textoPuntos(p) {
  const a = S.pts[p], b = S.pts[otro(p)];
  if (a >= 3 && b >= 3) {
    if (a === b) return '40';
    return a > b ? 'VENTAJA' : '40';
  }
  return String(ESCALA[a]);
}

function frasePuntos() {
  const a = S.pts.A, b = S.pts.B;
  // El tanteo se canta empezando por la pareja que saca (15-0, 0-15...)
  const sc = sacador();
  const p1 = sc ? sc.eq : 'A', p2 = otro(p1);
  const x = S.pts[p1], y = S.pts[p2];
  if (a >= 3 && b >= 3) {
    if (a === b) return 'Iguales';
    return 'Ventaja ' + nombrePareja(a > b ? 'A' : 'B');
  }
  return ESCALA[x] + ' ' + ESCALA[y];
}

// ===== Saque =====
// S.saque = { eq: pareja que saca, jug: { A: jugador (0/1) que saca cuando saca A, B: igual } }
function sacador() {
  const s = S.saque;
  if (!s) return null;
  return { eq: s.eq, j: s.jug[s.eq] };
}

// ===== Jugadas =====
function instantanea() {
  return JSON.stringify({ pts: S.pts, juegos: S.juegos, sets: S.sets, saque: S.saque, tb: S.tb, cambio: S.cambio, lados: S.lados, ant: S.ant });
}

function terminar(msg, dicho) {
  S.v++;
  S.msg = msg;
  S.dicho = dicho;
  refrescar();
  hablar(dicho);
  publicar();
}

// Cambio sin voz (nombres, saque, cambio de cancha sí/no)
function cambiar() {
  S.v++;
  S.dicho = '';
  refrescar();
  publicar();
}

function accionPunto(p) {
  S.hist.push(instantanea());
  if (S.hist.length > MAX_HIST) S.hist.shift();
  if (!S.ini) S.ini = Date.now();            // por si nadie eligió quién saca: empieza con el primer punto
  const q = otro(p);
  let msg = '', dicho = '', cambio = false;
  S.cambio = false;
  S.pts[p]++;

  if (S.pts[p] >= 4 && S.pts[p] - S.pts[q] >= 2) {
    // ===== Gana el juego =====
    const eraDecisivo = S.tb;
    S.pts = {A: 0, B: 0};
    S.juegos[p]++;
    msg = 'JUEGO ' + nombrePareja(p).toUpperCase();
    dicho = 'Juego ' + nombrePareja(p) + '. Juegos, ' + S.juegos.A + ' ' + S.juegos.B;

    // El saque pasa a la otra pareja; quien sacó, la próxima vez sacará su compañero
    if (S.saque) {
      S.saque.jug[S.saque.eq] ^= 1;
      S.saque.eq = otro(S.saque.eq);
    }

    const jp = S.juegos[p], jq = S.juegos[q];
    const total = jp + jq;
    if (eraDecisivo || (jp >= 6 && jp - jq >= 2)) {
      // Gana el set (el juego decisivo de 6-6 lo cierra 7-6)
      S.sets[p]++;
      S.ant.push({ A: S.juegos.A, B: S.juegos.B, tb: eraDecisivo ? 1 : 0 });
      S.juegos = {A: 0, B: 0};
      S.tb = false;
      msg = 'SET ' + nombrePareja(p).toUpperCase();
      dicho = 'Set ' + nombrePareja(p) + '. Sets, ' + S.sets.A + ' ' + S.sets.B;
      if (total % 2 === 1) cambio = true;
    } else if (jp === 6 && jq === 6) {
      // Seis iguales: último juego decisivo
      S.tb = true;
      msg = 'T.B.';
      dicho += '. Tie-break';
    } else if (total % 2 === 1) {
      cambio = true;  // juegos impares: 1, 3, 5, 7, 9, 11
    }
  } else {
    dicho = frasePuntos();
  }

  if (cambio && S.cc) {
    S.cambio = true;
    S.lados++;
    dicho += '. Cambio de cancha';
  }
  terminar(msg, dicho);
}

function deshacer() {
  if (!S.hist.length) return;
  Object.assign(S, JSON.parse(S.hist.pop()));
  terminar('', 'Anulado. ' + frasePuntos());
}

function reiniciar() {
  if (typeof confirm === 'function' && !confirm('¿Reiniciar todo el marcador?')) return;
  const v = S.v + 1;
  guardarLocal('nombresPadel', '');   // olvidar los nombres guardados en este móvil
  S = partidoNuevo(clonar(NOMBRES_DEF), S.cc);
  S.v = v;
  S.dicho = 'Marcador reiniciado';
  refrescar();
  hablar(S.dicho);
  publicar();
  abrirSaque(1);
}

// ===== Cronómetro: cuenta desde que se eligió quién saca =====
function textoCrono() {
  if (!S.ini) return '00:00:00';
  let s = Math.max(0, Math.floor((Date.now() - S.ini) / 1000));
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  const dos = n => (n < 10 ? '0' : '') + n;
  return dos(h) + ':' + dos(m) + ':' + dos(s);
}

// ===== Sincronización con Firebase =====
let enviando = false, pendiente = false, arrancado = false;

function conexion(ok) { if (typeof alConexion === 'function') alConexion(ok); }

function publicar() {
  pendiente = true;
  if (!enviando) enviar();
}

function enviar() {
  if (!RUTA) return;
  enviando = true;
  pendiente = false;
  fetch(RUTA, { method: 'PUT', body: JSON.stringify(S) })
    .then(r => { if (!r.ok) throw new Error('http'); conexion(true); })
    .catch(() => conexion(false))
    .then(() => { enviando = false; if (pendiente) enviar(); });
}

// Al abrir: si el partido no tiene saque elegido, se pregunta quién saca
function arranque() {
  if (arrancado || !PISTA) return;
  arrancado = true;
  if (!S.saque) abrirSaque(1);
}

function recibir(d) {
  if (!d) { arranque(); return; }
  const r = normalizar(d);
  if (r.v > S.v) {
    const hablarlo = arrancado && r.dicho;
    S = r;
    refrescar();
    if (typeof alRecibir === 'function') alRecibir();   // los avisos de otro aparato no cuentan como punto por voz
    if (hablarlo) hablar(r.dicho);
  } else if (r.v < S.v && !enviando) {
    publicar();  // este aparato va por delante (p. ej. jugó sin conexión)
  }
  arranque();
}

function descargar() {
  if (!RUTA) return;
  const ruta = RUTA;
  fetch(ruta).then(r => r.json()).then(d => { if (ruta === RUTA) recibir(d); }).catch(() => conexion(false));
}

let esPartido = null;
function conectar() {
  if (!RUTA) return;
  let es;
  try { es = new EventSource(RUTA); } catch (e) { return; }
  esPartido = es;
  es.addEventListener('put', ev => {
    conexion(true);
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.path === '/') recibir(m.data); else descargar();
  });
  es.addEventListener('patch', () => descargar());
  es.onerror = () => conexion(false);
}

// ===== Logo personalizado (se cambia en un mando y se ve en los tres) =====
let logoURL = leerLocal('logoPadel') || '';

function aplicarLogo() {
  document.querySelectorAll('img.logo').forEach(i => {
    i.style.display = '';
    i.src = logoURL || 'logo.jpg';
  });
}

function recibirLogo(v) {
  const nuevo = (typeof v === 'string' && v.indexOf('data:image') === 0) ? v : '';
  if (nuevo === logoURL) return;
  logoURL = nuevo;
  guardarLocal('logoPadel', logoURL);
  aplicarLogo();
}

function guardarLogo(dataURL) {
  recibirLogo(dataURL);
  fetch(RUTA_LOGO, { method: 'PUT', body: JSON.stringify(dataURL || null) })
    .then(r => { if (!r.ok) throw new Error('http'); conexion(true); })
    .catch(() => conexion(false));
}

// Convierte la imagen elegida en un cuadrado de 256 px (ligero y válido para el círculo del logo)
function procesarLogo(archivo, alTerminar) {
  if (!archivo) return;
  const url = URL.createObjectURL(archivo);
  const img = new Image();
  img.onload = () => {
    const T = 256, c = document.createElement('canvas');
    c.width = c.height = T;
    const g = c.getContext('2d');
    g.fillStyle = '#020817';
    g.fillRect(0, 0, T, T);
    const lado = Math.min(img.width, img.height);
    g.drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, T, T);
    URL.revokeObjectURL(url);
    guardarLogo(c.toDataURL('image/jpeg', 0.85));
    if (alTerminar) alTerminar(true);
  };
  img.onerror = () => { URL.revokeObjectURL(url); if (alTerminar) alTerminar(false); };
  img.src = url;
}

function conectarLogo() {
  aplicarLogo();
  fetch(RUTA_LOGO).then(r => r.json()).then(recibirLogo).catch(() => {});
  let es;
  try { es = new EventSource(RUTA_LOGO); } catch (e) { return; }
  es.addEventListener('put', ev => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.path === '/') recibirLogo(m.data);
  });
}

function iniciarMotor() {
  refrescar();
  if (PISTA) conectar(); else abrirPista();
  conectarLogo();
  setInterval(() => { if (typeof alTick === 'function') alTick(); }, 500);
  setTimeout(arranque, 4000);   // sin conexión: se juega igualmente en local
}

// ===== Historial de sets terminados: 7-6 T.B., 6-0, ... =====
function textoHistorial() {
  return (S.ant || []).map(r => r.A + '-' + r.B + (r.tb ? ' T.B.' : ''));
}

// ===== INTERFAZ COMPARTIDA: menú de tres puntitos, nombres, saque, pantalla completa =====
const $ = id => document.getElementById(id);

const BOLA_SVG = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#d4ff00" stroke="#9bbd00" stroke-width="3"/><path d="M 10 28 C 38 40 38 60 10 72" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M 90 28 C 62 40 62 60 90 72" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>';
document.querySelectorAll('.bola').forEach(b => { b.innerHTML = BOLA_SVG; });

function alConexion(ok) { $('conexion').classList.toggle('ok', !!ok); }

// ----- Menú -----
function abrirListaMenu() { pintarMenu(); $('fondoMenu').classList.add('abierto'); }
function cerrarListaMenu() { $('fondoMenu').classList.remove('abierto'); }

function pintarMenu() {
  $('botonCambio').textContent = 'CAMBIO DE CANCHA: ' + (S.cc ? 'SÍ' : 'NO');
  $('botonVoz').textContent = 'VOZ: ' + (vozActiva ? 'SÍ' : 'NO');
  const activa = document.fullscreenElement || document.webkitFullscreenElement;
  $('botonPantalla').textContent = activa ? 'SALIR DE PANTALLA COMPLETA' : 'PANTALLA COMPLETA';
  if ($('botonPista')) $('botonPista').textContent = 'PISTA ' + (PISTA || '-') + ' · CAMBIAR';
  if ($('pistaNum')) $('pistaNum').textContent = PISTA || '';
  if ($('chipPista')) $('chipPista').textContent = PISTA ? 'PISTA ' + PISTA : '';
  if (typeof pintarMenuExtra === 'function') pintarMenuExtra();
}

// ----- Nombres y pelota de saque -----
function pintarNombres() {
  ['A', 'B'].forEach(p => {
    for (let j = 0; j < 2; j++) $('n' + p + j).querySelector('span').textContent = S.nombres[p][j];
  });
}

function pintarBola() {
  const s = sacador();
  ['A', 'B'].forEach(p => {
    for (let j = 0; j < 2; j++) {
      const on = !!s && s.eq === p && s.j === j;
      $('n' + p + j).querySelector('.bola').classList.toggle('on', on);
    }
  });
}

function abrirNombres() {
  $('iA1').value = S.nombres.A[0];
  $('iA2').value = S.nombres.A[1];
  $('iB1').value = S.nombres.B[0];
  $('iB2').value = S.nombres.B[1];
  $('menu').classList.add('abierto');
}

function guardarNombres() {
  const v = id => $(id).value.trim();
  S.nombres = {
    A: [v('iA1') || 'Jugador 1', v('iA2') || 'Jugador 2'],
    B: [v('iB1') || 'Jugador 3', v('iB2') || 'Jugador 4']
  };
  guardarLocal('nombresPadel', JSON.stringify(S.nombres));
  $('menu').classList.remove('abierto');
  cambiar();
}

// ----- Quién saca -----
let saqueTmp = null;

function abrirSaque(paso, eqPrimero) {
  const caja = $('opcionesSaque');
  caja.innerHTML = '';
  caja.style.gridTemplateColumns = '1fr 1fr';
  if (paso === 1) {
    $('tituloSaque').textContent = '¿QUIÉN SACA PRIMERO?';
    [0, 1].forEach(j => ['A', 'B'].forEach(p => {
      caja.appendChild(botonJugador(p, j, () => elegirSaque(1, p, j)));
    }));
  } else {
    $('tituloSaque').textContent = '¿QUIÉN SACA DE LA OTRA PAREJA?';
    const q = otro(eqPrimero);
    [0, 1].forEach(j => caja.appendChild(botonJugador(q, j, () => elegirSaque(2, q, j))));
  }
  $('ventanaSaque').classList.add('abierto');
}

function botonJugador(p, j, accion) {
  const b = document.createElement('button');
  b.textContent = S.nombres[p][j];
  b.style.borderColor = p === 'A' ? '#ff2a1f' : '#2f6bff';
  b.onclick = accion;
  return b;
}

function elegirSaque(paso, p, j) {
  if (paso === 1) {
    saqueTmp = { eq: p, jug: { A: 0, B: 0 } };
    saqueTmp.jug[p] = j;
    abrirSaque(2, p);
  } else {
    saqueTmp.jug[p] = j;
    S.saque = saqueTmp;
    if (!S.ini) S.ini = Date.now();     // aquí empieza el partido y el cronómetro
    saqueTmp = null;
    cerrarSaque();
    cambiar();
  }
}


// ----- Pista: cada pista tiene su propio partido (hasta 5) -----
function abrirPista() {
  const caja = $('opcionesPista');
  caja.innerHTML = '';
  caja.style.gridTemplateColumns = 'repeat(5, 1fr)';
  for (let n = 1; n <= PISTAS; n++) {
    const b = document.createElement('button');
    b.textContent = n;
    b.style.fontSize = '2.4rem';
    if (n === PISTA) { b.style.background = '#8dff00'; b.style.color = '#000'; }
    b.onclick = () => elegirPista(n);
    caja.appendChild(b);
  }
  $('cancelarPista').style.display = PISTA ? '' : 'none';   // la primera vez hay que elegir una
  $('ventanaPista').classList.add('abierto');
}

function cerrarPista() { $('ventanaPista').classList.remove('abierto'); }

function elegirPista(n) {
  if (n === PISTA) { cerrarPista(); return; }
  PISTA = n;
  guardarLocal('pistaPadel', String(n));
  RUTA = rutaDe(n);
  if (esPartido) { try { esPartido.close(); } catch (e) {} esPartido = null; }
  S = partidoNuevo(nombresIniciales(), S.cc);   // el partido de esta pista llegará de Firebase
  enviando = false; pendiente = false; arrancado = false;
  cerrarPista();
  refrescar();
  conectar();
  setTimeout(arranque, 4000);
}

function cerrarSaque() { $('ventanaSaque').classList.remove('abierto'); }

// ----- Cambio de cancha, voz, pantalla completa -----
function alternarCambio() {
  S.cc = !S.cc;
  guardarLocal('cambioCancha', S.cc ? 'si' : 'no');
  if (!S.cc) S.cambio = false;
  cambiar();
}

function alternarVoz() {
  vozActiva = !vozActiva;
  guardarLocal('vozPadel', vozActiva ? 'si' : 'no');
  if (!vozActiva && typeof speechSynthesis !== 'undefined') speechSynthesis.cancel();
  pintarMenu();
}

function pantallaCompleta() {
  const d = document, el = d.documentElement;
  const activa = d.fullscreenElement || d.webkitFullscreenElement;
  try {
    if (!activa) {
      const f = el.requestFullscreen || el.webkitRequestFullscreen;
      const r = f && f.call(el);
      if (r && r.then && typeof bloquearHorizontal === 'function') r.then(bloquearHorizontal).catch(() => {});
    } else {
      (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    }
  } catch (e) {}
}
document.addEventListener('fullscreenchange', pintarMenu);
document.addEventListener('webkitfullscreenchange', pintarMenu);

// ----- Mantener la pantalla encendida -----
async function pantallaEncendida() {
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
}
pantallaEncendida();
document.addEventListener('visibilitychange', () => { if (!document.hidden) pantallaEncendida(); });


// ===== Horizontal =====
function bloquearHorizontal() {
  try {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  } catch (e) {}
}
bloquearHorizontal();
document.addEventListener('click', bloquearHorizontal, { once: true });

// ===== Pintar el marcador =====
function pintarPuntos(p) {
  const t = textoPuntos(p);
  const el = $('puntos' + p);
  el.querySelector('span').textContent = t === 'VENTAJA' ? 'AD' : t;   // en el marcador, ventaja = AD
  el.classList.toggle('ad', t === 'VENTAJA');
}

// Columnas de sets: terminados (blanco), el actual (brillo) y los que faltan (azul)
function pintarSets() {
  const ant = S.ant || [];
  const n = Math.max(3, Math.min(5, ant.length + 1));
  $('cuerpo').style.setProperty('--n', n);
  let cab = '', fa = '', fb = '';
  for (let i = 0; i < n; i++) {
    let a, b, ca = '', cb = '', tb = false;
    if (i < ant.length) {
      a = ant[i].A; b = ant[i].B; tb = !!ant[i].tb;
      ca = a > b ? 'gana' : 'pierde'; cb = b > a ? 'gana' : 'pierde';
    } else if (i === ant.length) {
      a = S.juegos.A; b = S.juegos.B; ca = cb = 'actual';
      tb = S.tb;
    } else {
      a = 0; b = 0; ca = cb = 'futuro';
    }
    cab += '<div>SET ' + (i + 1) + (tb ? '<span class="tbmini">T.B.</span>' : '') + '</div>';
    fa += '<div class="' + ca + '">' + a + '</div>';
    fb += '<div class="' + cb + '">' + b + '</div>';
  }
  $('cabSet').innerHTML = cab;
  $('setsA').innerHTML = fa;
  $('setsB').innerHTML = fb;
}

function pintarCrono() { $('crono').textContent = textoCrono(); }

function refrescar() {
  pintarPuntos('A');
  pintarPuntos('B');
  pintarSets();
  const a = S.pts.A, b = S.pts.B;
  $('subtitulo').innerHTML = S.msg || (S.tb ? 'JUEGO DECISIVO' : ((a >= 3 && b >= 3 && a === b) ? 'IGUALES' : '&nbsp;'));
  $('tb').classList.toggle('on', !!S.tb);
  $('cambio').style.display = S.cambio ? 'block' : 'none';
  pintarNombres();
  pintarBola();
  pintarCrono();
  pintarMenu();
}

function alTick() { pintarCrono(); }

iniciarMotor();
</script>
