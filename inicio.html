<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Marcador de pádel</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; background: #000; color: #fff; font-family: 'Arial Black', Arial, sans-serif; text-align: center; }
  .logo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; }
  h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: 3px; }
  a { display: block; width: 100%; max-width: 420px; padding: 26px 10px; border-radius: 20px; color: #fff; text-decoration: none; font-size: 1.7rem; letter-spacing: 2px; }
  a:active { transform: scale(0.98); }
  .m { background: #333; }
  .a { background: #ff2a2a; }
  .b { background: #2a8bff; }
  small { color: #888; font-size: 0.85rem; }
</style>
</head>
<body>
  <img class="logo" src="logo.jpg" alt="Logo" onerror="this.style.display='none'">
  <h1>¿QUÉ QUIERES USAR?</h1>
  <a class="m" href="marcador.html">MARCADOR</a>
