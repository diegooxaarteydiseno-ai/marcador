<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mando pareja B</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #000; color: #fff; font-family: 'Arial Black', Arial, sans-serif; text-align: center; user-select: none; overflow: hidden; }

  :root {
    --rojo: #ff2a1f;
    --amarillo: #ffd400;
    --azul: #2f6bff;
    --verde: #8dff00;
  }

  /* ===== Pelota de saque ===== */
  .bola { width: 1.15em; height: 1.15em; flex: none; visibility: hidden; filter: drop-shadow(0 0 6px #d4ff00); }
  .bola.on { visibility: visible; }
  .bola svg { width: 100%; height: 100%; display: block; }

  /* ===== Tres puntitos + menú desplegable ===== */
  #botonMenu { position: fixed; top: 14px; right: 14px; z-index: 20; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--verde); background: rgba(0,0,0,.75); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; box-shadow: 0 0 10px rgba(141,255,0,.5); padding: 0; }
  #botonMenu span { width: 6px; height: 6px; border-radius: 50%; background: var(--verde); display: block; }
  #fondoMenu { position: fixed; inset: 0; z-index: 21; display: none; }
  #fondoMenu.abierto { display: block; }
  #listaMenu { position: absolute; top: 68px; right: 14px; background: #0b0b0b; border: 2px solid var(--verde); border-radius: 14px; box-shadow: 0 0 20px rgba(141,255,0,.45); overflow-y: auto; max-height: calc(100vh - 80px); min-width: 260px; max-width: calc(100vw - 28px); }
  #listaMenu button { display: block; width: 100%; text-align: left; padding: 11px 18px; font-size: .95rem; font-family: inherit; color: #fff; background: transparent; border: none; border-bottom: 1px solid #222; cursor: pointer; letter-spacing: 1px; }
  #listaMenu button:last-child { border-bottom: none; }
  #listaMenu button:active { background: #1d2a00; }
  #listaMenu .reiniciar { color: #ff6b6b; }

  /* ===== Ventanas (nombres y saque) ===== */
  .ventana { position: fixed; inset: 0; background: rgba(0,0,0,.93); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; z-index: 30; overflow: auto; }
  .ventana.abierto { display: flex; }
  .ventana h2 { margin: 0 0 6px; color: var(--verde); letter-spacing: 3px; text-shadow: 0 0 10px var(--verde); font-size: 1.3rem; }
  .grupo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(640px, 100%); }
  .grupo label { font-size: .8rem; color: #aaa; display: block; text-align: left; margin-bottom: 3px; font-family: Arial, sans-serif; }
  .grupo input { width: 100%; font-size: 1.2rem; padding: 10px; border-radius: 10px; border: 2px solid var(--verde); background: #000; color: #fff; font-family: Arial, sans-serif; }
  .ventana .cerrar { margin-top: 8px; background: var(--verde); color: #000; font-weight: 900; font-size: 1.1rem; padding: 12px 36px; border: none; border-radius: 12px; cursor: pointer; font-family: inherit; }
  .ventana .secundario { background: transparent; color: #aaa; border: 2px solid #444; }
  .elegir { display: grid; gap: 10px; width: min(640px, 100%); }
  .elegir button { font-size: 1.2rem; padding: 16px 10px; border-radius: 12px; border: 2px solid var(--verde); background: #000; color: #fff; font-family: inherit; text-transform: uppercase; cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
  .elegir button:active { background: #1d2a00; }

  /* ===== Punto de conexión (verde = sincronizado) ===== */
  #conexion { position: fixed; top: 31px; right: 68px; z-index: 20; width: 10px; height: 10px; border-radius: 50%; background: #ff2a1f; box-shadow: 0 0 6px #ff2a1f; }
  #conexion.ok { background: #16a34a; box-shadow: 0 0 6px #16a34a; }


  .cabecera { display: flex; align-items: center; gap: 8px; padding: 8px 72px 8px 10px; background: #111; border-bottom: 3px solid #333; }
  .logo { height: 52px; width: 52px; border-radius: 50%; object-fit: cover; flex: none; }

  /* Mini tablero: sets, juegos y punto actual */
  .tablero { border-collapse: collapse; flex: 1; min-width: 0; }
  .tablero th { font-size: .75rem; color: #888; letter-spacing: 1px; font-weight: 400; padding: 0 4px; font-family: Arial, sans-serif; }
  .tablero td { padding: 1px 6px; font-size: 1.8rem; line-height: 1.15; }
  .tablero td.eq { font-size: 1.1rem; width: 1.6em; }
  .tablero tr.fA td { color: #ff2a2a; }
  .tablero tr.fB td { color: #2a8bff; }
  .tablero tr.mio td { background: #1f1f1f; }

  .cambio { display: none; width: 40px; height: 40px; flex: none; filter: drop-shadow(0 0 6px var(--verde)); animation: parpadeo 1s infinite; }
  .cambio svg { width: 100%; height: 100%; display: block; }
  @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  .mini { display: grid; grid-template-columns: 1fr 1fr; background: #111; border-bottom: 3px solid #333; }
  .caja { padding: 8px 4px; border-top: 4px solid transparent; min-width: 0; }
  .caja.A { border-top-color: #ff2a2a; }
  .caja.B { border-top-color: #2a8bff; }
  .caja.mio { background: #1c1c1c; }
  .caja.mio .nombres div { text-shadow: 0 0 6px var(--verde), 0 0 14px var(--verde); animation: brillo 1.6s ease-in-out infinite; }
  @keyframes brillo { 0%, 100% { text-shadow: 0 0 4px var(--verde), 0 0 8px var(--verde); } 50% { text-shadow: 0 0 8px var(--verde), 0 0 20px var(--verde); } }
  .nombres { display: flex; flex-direction: column; gap: 2px; }
  .nombres div { display: flex; align-items: center; justify-content: flex-start; gap: 6px; font-size: 1.05rem; color: #fff; white-space: nowrap; overflow: hidden; padding: 0 6px; text-transform: uppercase; letter-spacing: 1px; }
  .nombres div span { overflow: hidden; text-overflow: ellipsis; }
  .puntos { font-size: 3.4rem; line-height: 1.1; margin-top: 4px; }
  .cA { color: #ff2a2a; }
  .cB { color: #2a8bff; }

  /* ===== Botones 3D realistas ===== */
  .mas, .menos { position: relative; border: none; color: #fff; font-family: inherit; line-height: 1; cursor: pointer; overflow: hidden; touch-action: manipulation; transition: transform .07s ease, box-shadow .07s ease, filter .07s ease; }
  /* reflejo de luz curvo en la parte de arriba */
  .mas::before, .menos::before { content: ''; position: absolute; left: 4%; right: 4%; top: 2%; height: 42%; border-radius: 50% 50% 50% 50% / 100% 100% 60% 60%; background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 70%, rgba(255,255,255,0) 100%); pointer-events: none; }
  /* destello pequeño abajo */
  .mas::after, .menos::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: 3%; height: 14%; border-radius: 50%; background: linear-gradient(0deg, rgba(255,255,255,.22), rgba(255,255,255,0)); pointer-events: none; }

  .mas { width: 100%; height: 100%; margin: 0; border-radius: 22px; font-size: 5.5rem;
    background: radial-gradient(120% 90% at 50% 0%, #6dff9a 0%, #22c55e 28%, #15803d 68%, #0b4f26 100%);
    text-shadow: 0 -3px 0 rgba(255,255,255,.25), 0 6px 8px rgba(0,0,0,.55), 0 0 18px rgba(190,255,210,.35);
    box-shadow:
      inset 0 3px 2px rgba(255,255,255,.65),
      inset 0 -10px 18px rgba(0,40,15,.65),
      inset 6px 0 14px rgba(0,60,25,.35),
      inset -6px 0 14px rgba(0,60,25,.35),
      0 10px 0 #0a3d1c,
      0 14px 0 #062a13,
      0 22px 28px rgba(0,0,0,.85),
      0 0 24px rgba(34,197,94,.35); }
  .mas:active { transform: translateY(8px);
    box-shadow:
      inset 0 3px 2px rgba(255,255,255,.4),
      inset 0 -6px 14px rgba(0,40,15,.7),
      inset 0 10px 22px rgba(0,30,10,.5),
      0 2px 0 #0a3d1c,
      0 4px 0 #062a13,
      0 8px 12px rgba(0,0,0,.8),
      0 0 14px rgba(34,197,94,.25);
    filter: brightness(.93); }
  .menos { width: 100%; height: 100%; margin: 0; border-radius: 22px; font-size: 4.5rem;
    background: radial-gradient(120% 110% at 50% 0%, #ff8a80 0%, #ef4444 30%, #b91c1c 70%, #6b0f0f 100%);
    text-shadow: 0 -2px 0 rgba(255,255,255,.25), 0 4px 6px rgba(0,0,0,.55), 0 0 12px rgba(255,200,200,.3);
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.65),
      inset 0 -7px 12px rgba(70,0,0,.65),
      inset 4px 0 10px rgba(90,0,0,.35),
      inset -4px 0 10px rgba(90,0,0,.35),
      0 7px 0 #7a1010,
      0 10px 0 #4d0a0a,
      0 16px 20px rgba(0,0,0,.85),
      0 0 18px rgba(239,68,68,.3); }
  .menos:active { transform: translateY(6px);
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.4),
      inset 0 -4px 10px rgba(70,0,0,.7),
      inset 0 8px 16px rgba(50,0,0,.5),
      0 1px 0 #7a1010,
      0 3px 0 #4d0a0a,
      0 6px 9px rgba(0,0,0,.8),
      0 0 10px rgba(239,68,68,.2);
    filter: brightness(.93); }
  /* ===== Zona de cámara (suma el punto al acercar la pala) ===== */
  .camara { position: relative; flex: 1; min-height: 0; margin: 12px 12px 18px; border-radius: 22px; overflow: hidden; border: 3px solid var(--verde); background: #061200; box-shadow: 0 0 18px rgba(141,255,0,.35); cursor: pointer; transition: background .15s ease, border-color .15s ease; }
  .camara video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .45; }
  .camTexto { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; font-size: 1.4rem; letter-spacing: 2px; color: var(--verde); text-shadow: 0 0 10px rgba(0,0,0,.9); pointer-events: none; }
  .camBarra { position: absolute; left: 12px; right: 12px; bottom: 10px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
  .camBarra i { display: block; height: 100%; width: 0; background: var(--verde); }
  .camara.tapando { border-color: var(--amarillo); }
  .camara.punto { background: #22c55e; border-color: #fff; }
  .camara.punto .camTexto { color: #000; text-shadow: none; font-size: 3rem; }
  .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 0 12px 28px; height: 120px; flex: none; }
</style>
</head>
<body>

<div class="cabecera">
  <img class="logo" src="logo.jpg" alt="Logo" onerror="this.style.display='none'">
  <table class="tablero">
    <tr><th></th><th>SETS</th><th>JUEGOS</th><th>PUNTO</th></tr>
    <tr class="fA" id="filaA"><td class="eq">A</td><td id="tsA">0</td><td id="tjA">0</td><td id="tpA">0</td></tr>
    <tr class="fB" id="filaB"><td class="eq">B</td><td id="tsB">0</td><td id="tjB">0</td><td id="tpB">0</td></tr>
  </table>
  <div class="cambio" id="cambio">
    <svg viewBox="0 0 100 100" fill="none" stroke="#8dff00" stroke-width="9" stroke-linecap="round">
      <path d="M 22 50 A 28 28 0 0 1 78 50"/>
      <path d="M 78 50 A 28 28 0 0 1 22 50"/>
      <polygon points="66,46 90,46 78,62" fill="#8dff00" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="10,54 34,54 22,38" fill="#8dff00" stroke-width="3" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

<div class="mini">
  <div id="cajaA" class="caja A">
    <div class="nombres">
      <div id="nA0"><i class="bola"></i><span></span></div>
      <div id="nA1"><i class="bola"></i><span></span></div>
    </div>
    <div class="puntos cA" id="puntosA">0</div>
  </div>
  <div id="cajaB" class="caja B">
    <div class="nombres">
      <div id="nB0"><i class="bola"></i><span></span></div>
      <div id="nB1"><i class="bola"></i><span></span></div>
    </div>
    <div class="puntos cB" id="puntosB">0</div>
  </div>
</div>

<div class="camara" id="camara">
  <video id="video" playsinline muted autoplay></video>
  <div class="camTexto" id="camTexto">TOCA PARA ACTIVAR LA CÁMARA</div>
  <div class="camBarra"><i id="camNivel"></i></div>
</div>

<div class="botones">
  <button class="menos" id="menos">−</button>
  <button class="mas" id="mas">+</button>
</div>

<div id="conexion" title="Conexión"></div>
<button id="botonMenu" onclick="abrirListaMenu()" aria-label="Menú"><span></span><span></span><span></span></button>

<div id="fondoMenu" onclick="cerrarListaMenu()">
  <div id="listaMenu" onclick="event.stopPropagation()">
    <button onclick="cerrarListaMenu(); abrirNombres()">NOMBRES</button>
    <button onclick="cerrarListaMenu(); abrirSaque(1)">QUIÉN SACA</button>
    <button id="botonCambio" onclick="alternarCambio(); cerrarListaMenu()">CAMBIO DE CANCHA: SÍ</button>
    <button id="botonVoz" onclick="alternarVoz(); cerrarListaMenu()">VOZ: SÍ</button>
    <button id="botonCamara" onclick="alternarCamara(); cerrarListaMenu()">CÁMARA: SÍ</button>
    <button id="botonSens" onclick="alternarSens()">SENSIBILIDAD: MEDIA</button>
    <button id="botonPantalla" onclick="pantallaCompleta(); cerrarListaMenu()">PANTALLA COMPLETA</button>
    <button onclick="deshacer(); cerrarListaMenu()">DESHACER</button>
    <button class="reiniciar" onclick="cerrarListaMenu(); reiniciar()">REINICIAR</button>
  </div>
</div>

<div id="menu" class="ventana">
  <h2>NOMBRES</h2>
  <div class="grupo">
    <div><label>Pareja A · jugador 1</label><input id="iA1" maxlength="14"></div>
    <div><label>Pareja B · jugador 1</label><input id="iB1" maxlength="14"></div>
    <div><label>Pareja A · jugador 2</label><input id="iA2" maxlength="14"></div>
    <div><label>Pareja B · jugador 2</label><input id="iB2" maxlength="14"></div>
  </div>
  <button class="cerrar" onclick="guardarNombres()">GUARDAR</button>
</div>

<div id="ventanaSaque" class="ventana">
  <h2 id="tituloSaque">¿QUIÉN SACA PRIMERO?</h2>
  <div class="elegir" id="opcionesSaque"></div>
  <button class="cerrar secundario" onclick="cerrarSaque()">CANCELAR</button>
</div>


<script>
// ====== CONFIGURACIÓN DE ESTE MANDO ======
const PAREJA = 'B';
const VOZ_DEFECTO = false;   // en los mandos la voz empieza apagada (habla el marcador); se activa desde el menú
// =========================================

// ===== MOTOR COMPARTIDO: marcador y mandos usan exactamente este código =====
// El partido vive en Firebase (/partido). Cada aparato aplica la jugada, y la envía.
const DB_URL = 'https://marcadoroxa-default-rtdb.europe-west1.firebasedatabase.app';
const RUTA = DB_URL + '/partido.json';
const ESCALA = [0, 15, 30, 40];
const NOMBRES_DEF = { A: ['Jugador 1', 'Jugador 2'], B: ['Jugador 3', 'Jugador 4'] };
const MAX_HIST = 30;

function leerLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function guardarLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function clonar(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }
function otro(p) { return p === 'A' ? 'B' : 'A'; }

function nombresIniciales() {
  try { const g = JSON.parse(leerLocal('nombresPadel')); if (g && g.A && g.B) return g; } catch (e) {}
  return clonar(NOMBRES_DEF);
}

function partidoNuevo(nombres, cc) {
  return { v: 0, pts: {A: 0, B: 0}, juegos: {A: 0, B: 0}, sets: {A: 0, B: 0},
           saque: null, tb: false, tbIni: null, cambio: false, lados: 0, hist: [],
           nombres: nombres, cc: cc, msg: '', dicho: '' };
}

let S = partidoNuevo(nombresIniciales(), leerLocal('cambioCancha') !== 'no');
let vozActiva = leerLocal('vozPadel') ? leerLocal('vozPadel') === 'si' : VOZ_DEFECTO;

// Firebase quita los vacíos (listas [] y null): se rellenan al recibir
function normalizar(d) {
  const par = o => ({ A: (o && o.A) || 0, B: (o && o.B) || 0 });
  const saque = s => s ? { eq: s.eq, jug: par(s.jug) } : null;
  const nom = (x, def) => [ (x && x[0]) || def[0], (x && x[1]) || def[1] ];
  const r = {};
  r.v = d.v || 0;
  r.pts = par(d.pts); r.juegos = par(d.juegos); r.sets = par(d.sets);
  r.saque = saque(d.saque);
  r.tb = !!d.tb;
  r.tbIni = saque(d.tbIni);
  r.cambio = !!d.cambio;
  r.lados = d.lados || 0;
  r.hist = Array.isArray(d.hist) ? d.hist : (d.hist ? Object.values(d.hist) : []);
  r.nombres = { A: nom(d.nombres && d.nombres.A, NOMBRES_DEF.A), B: nom(d.nombres && d.nombres.B, NOMBRES_DEF.B) };
  r.cc = d.cc !== false;
  r.msg = d.msg || '';
  r.dicho = d.dicho || '';
  return r;
}

// ===== Voz =====
function hablar(texto) {
  if (!vozActiva || !texto || typeof speechSynthesis === 'undefined') return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'es-ES';
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ===== Textos =====
function nombrePareja(p) { return S.nombres[p][0] + ' y ' + S.nombres[p][1]; }

// Texto del punto de cada pareja (VENTAJA se muestra como AD donde falta espacio)
function textoPuntos(p) {
  const a = S.pts[p], b = S.pts[otro(p)];
  if (S.tb) return String(a);
  if (a >= 3 && b >= 3) {
    if (a === b) return '40';
    return a > b ? 'VENTAJA' : '40';
  }
  return String(ESCALA[a]);
}

function frasePuntos() {
  const a = S.pts.A, b = S.pts.B;
  if (S.tb) return a + ' ' + b;
  if (a >= 3 && b >= 3) {
    if (a === b) return 'Iguales';
    return 'Ventaja ' + nombrePareja(a > b ? 'A' : 'B');
  }
  return ESCALA[a] + ' ' + ESCALA[b];
}

// ===== Saque =====
// S.saque = { eq: pareja que saca, jug: { A: jugador (0/1) que saca cuando saca A, B: igual } }
function sacador() {
  const s = S.saque;
  if (!s) return null;
  if (!S.tb) return { eq: s.eq, j: s.jug[s.eq] };
  // Tie-break: el primero saca 1 punto, luego 2 puntos cada jugador por turnos
  const ini = S.tbIni || s;
  const n = S.pts.A + S.pts.B;
  const k = Math.ceil(n / 2);
  const eq = (k % 2 === 0) ? ini.eq : otro(ini.eq);
  const occ = (k % 2 === 0) ? k / 2 : (k - 1) / 2;
  return { eq: eq, j: ini.jug[eq] ^ (occ % 2) };
}

// ===== Jugadas =====
function instantanea() {
  return JSON.stringify({ pts: S.pts, juegos: S.juegos, sets: S.sets, saque: S.saque, tb: S.tb, tbIni: S.tbIni, cambio: S.cambio, lados: S.lados });
}

function terminar(msg, dicho) {
  S.v++;
  S.msg = msg;
  S.dicho = dicho;
  refrescar();
  hablar(dicho);
  publicar();
}

// Cambio sin voz (nombres, saque, cambio de cancha sí/no)
function cambiar() {
  S.v++;
  S.dicho = '';
  refrescar();
  publicar();
}

function accionPunto(p) {
  S.hist.push(instantanea());
  if (S.hist.length > MAX_HIST) S.hist.shift();
  const q = otro(p);
  let msg = '', dicho = '', cambio = false;
  S.cambio = false;
  S.pts[p]++;

  if (S.tb) {
    // ===== Tie-break: a 7 puntos con 2 de diferencia =====
    if (S.pts[p] >= 7 && S.pts[p] - S.pts[q] >= 2) {
      S.juegos[p]++;
      S.sets[p]++;
      msg = 'SET ' + nombrePareja(p).toUpperCase();
      dicho = 'Set ' + nombrePareja(p) + '. Sets, ' + S.sets.A + ' ' + S.sets.B;
      if (S.saque && S.tbIni) {
        const t = otro(S.tbIni.eq);  // empieza a sacar quien recibió primero
        S.saque = { eq: t, jug: { A: S.tbIni.jug.A ^ 1, B: S.tbIni.jug.B ^ 1 } };
      }
      S.juegos = {A: 0, B: 0};
      S.pts = {A: 0, B: 0};
      S.tb = false;
      S.tbIni = null;
      cambio = true;  // el set termina 7-6 = 13 juegos (impar)
    } else {
      dicho = S.pts.A + ' ' + S.pts.B;
      if ((S.pts.A + S.pts.B) % 6 === 0) cambio = true;  // cada 6 puntos
    }
  } else if (S.pts[p] >= 4 && S.pts[p] - S.pts[q] >= 2) {
    // ===== Gana el juego =====
    S.pts = {A: 0, B: 0};
    S.juegos[p]++;
    msg = 'JUEGO ' + nombrePareja(p).toUpperCase();
    dicho = 'Juego ' + nombrePareja(p) + '. Juegos, ' + S.juegos.A + ' ' + S.juegos.B;

    // El saque pasa a la otra pareja; quien sacó, la próxima vez sacará su compañero
    if (S.saque) {
      S.saque.jug[S.saque.eq] ^= 1;
      S.saque.eq = otro(S.saque.eq);
    }

    const jp = S.juegos[p], jq = S.juegos[q];
    const total = jp + jq;
    if (jp >= 6 && jp - jq >= 2) {
      // Gana el set
      S.sets[p]++;
      S.juegos = {A: 0, B: 0};
      msg = 'SET ' + nombrePareja(p).toUpperCase();
      dicho = 'Set ' + nombrePareja(p) + '. Sets, ' + S.sets.A + ' ' + S.sets.B;
      if (total % 2 === 1) cambio = true;
    } else if (jp === 6 && jq === 6) {
      // Empieza el tie-break
      S.tb = true;
      S.pts = {A: 0, B: 0};
      S.tbIni = S.saque ? clonar(S.saque) : null;
      msg = 'TIE-BREAK';
      dicho += '. Tie-break';
    } else if (total % 2 === 1) {
      cambio = true;  // juegos impares: 1, 3, 5, 7, 9, 11
    }
  } else {
    dicho = frasePuntos();
  }

  if (cambio && S.cc) {
    S.cambio = true;
    S.lados++;
    dicho += '. Cambio de cancha';
  }
  terminar(msg, dicho);
}

function deshacer() {
  if (!S.hist.length) return;
  Object.assign(S, JSON.parse(S.hist.pop()));
  terminar('', 'Punto anulado. ' + frasePuntos());
}

function reiniciar() {
  if (typeof confirm === 'function' && !confirm('¿Reiniciar todo el marcador?')) return;
  const v = S.v + 1;
  guardarLocal('nombresPadel', '');   // olvidar los nombres guardados en este móvil
  S = partidoNuevo(clonar(NOMBRES_DEF), S.cc);
  S.v = v;
  S.dicho = 'Marcador reiniciado';
  refrescar();
  hablar(S.dicho);
  publicar();
  abrirSaque(1);
}

// ===== Sincronización con Firebase =====
let enviando = false, pendiente = false, arrancado = false;

function conexion(ok) { if (typeof alConexion === 'function') alConexion(ok); }

function publicar() {
  pendiente = true;
  if (!enviando) enviar();
}

function enviar() {
  enviando = true;
  pendiente = false;
  fetch(RUTA, { method: 'PUT', body: JSON.stringify(S) })
    .then(r => { if (!r.ok) throw new Error('http'); conexion(true); })
    .catch(() => conexion(false))
    .then(() => { enviando = false; if (pendiente) enviar(); });
}

// Al abrir: si el partido no tiene saque elegido, se pregunta quién saca
function arranque() {
  if (arrancado) return;
  arrancado = true;
  if (!S.saque) abrirSaque(1);
}

function recibir(d) {
  if (!d) { arranque(); return; }
  const r = normalizar(d);
  if (r.v > S.v) {
    const hablarlo = arrancado && r.dicho;
    S = r;
    refrescar();
    if (hablarlo) hablar(r.dicho);
  } else if (r.v < S.v && !enviando) {
    publicar();  // este aparato va por delante (p. ej. jugó sin conexión)
  }
  arranque();
}

function descargar() {
  fetch(RUTA).then(r => r.json()).then(recibir).catch(() => conexion(false));
}

function conectar() {
  let es;
  try { es = new EventSource(RUTA); } catch (e) { return; }
  es.addEventListener('put', ev => {
    conexion(true);
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.path === '/') recibir(m.data); else descargar();
  });
  es.addEventListener('patch', () => descargar());
  es.onerror = () => conexion(false);
}

function iniciarMotor() {
  refrescar();
  conectar();
  setTimeout(arranque, 4000);   // sin conexión: se juega igualmente en local
}


// ===== INTERFAZ COMPARTIDA: menú de tres puntitos, nombres, saque, pantalla completa =====
const $ = id => document.getElementById(id);

const BOLA_SVG = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#d4ff00" stroke="#9bbd00" stroke-width="3"/><path d="M 10 28 C 38 40 38 60 10 72" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M 90 28 C 62 40 62 60 90 72" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>';
document.querySelectorAll('.bola').forEach(b => { b.innerHTML = BOLA_SVG; });

function alConexion(ok) { $('conexion').classList.toggle('ok', !!ok); }

// ----- Menú -----
function abrirListaMenu() { pintarMenu(); $('fondoMenu').classList.add('abierto'); }
function cerrarListaMenu() { $('fondoMenu').classList.remove('abierto'); }

function pintarMenu() {
  $('botonCambio').textContent = 'CAMBIO DE CANCHA: ' + (S.cc ? 'SÍ' : 'NO');
  $('botonVoz').textContent = 'VOZ: ' + (vozActiva ? 'SÍ' : 'NO');
  $('botonCamara').textContent = 'CÁMARA: ' + (camActiva ? 'SÍ' : 'NO');
  $('botonSens').textContent = 'SENSIBILIDAD: ' + sens.toUpperCase();
  const activa = document.fullscreenElement || document.webkitFullscreenElement;
  $('botonPantalla').textContent = activa ? 'SALIR DE PANTALLA COMPLETA' : 'PANTALLA COMPLETA';
}

// ----- Nombres y pelota de saque -----
function pintarNombres() {
  ['A', 'B'].forEach(p => {
    for (let j = 0; j < 2; j++) $('n' + p + j).querySelector('span').textContent = S.nombres[p][j];
  });
}

function pintarBola() {
  const s = sacador();
  ['A', 'B'].forEach(p => {
    for (let j = 0; j < 2; j++) {
      const on = !!s && s.eq === p && s.j === j;
      $('n' + p + j).querySelector('.bola').classList.toggle('on', on);
    }
  });
}

function abrirNombres() {
  $('iA1').value = S.nombres.A[0];
  $('iA2').value = S.nombres.A[1];
  $('iB1').value = S.nombres.B[0];
  $('iB2').value = S.nombres.B[1];
  $('menu').classList.add('abierto');
}

function guardarNombres() {
  const v = id => $(id).value.trim();
  S.nombres = {
    A: [v('iA1') || 'Jugador 1', v('iA2') || 'Jugador 2'],
    B: [v('iB1') || 'Jugador 3', v('iB2') || 'Jugador 4']
  };
  guardarLocal('nombresPadel', JSON.stringify(S.nombres));
  $('menu').classList.remove('abierto');
  cambiar();
}

// ----- Quién saca -----
let saqueTmp = null;

function abrirSaque(paso, eqPrimero) {
  const caja = $('opcionesSaque');
  caja.innerHTML = '';
  caja.style.gridTemplateColumns = '1fr 1fr';
  if (paso === 1) {
    $('tituloSaque').textContent = '¿QUIÉN SACA PRIMERO?';
    [0, 1].forEach(j => ['A', 'B'].forEach(p => {
      caja.appendChild(botonJugador(p, j, () => elegirSaque(1, p, j)));
    }));
  } else {
    $('tituloSaque').textContent = '¿QUIÉN SACA DE LA OTRA PAREJA?';
    const q = otro(eqPrimero);
    [0, 1].forEach(j => caja.appendChild(botonJugador(q, j, () => elegirSaque(2, q, j))));
  }
  $('ventanaSaque').classList.add('abierto');
}

function botonJugador(p, j, accion) {
  const b = document.createElement('button');
  b.textContent = S.nombres[p][j];
  b.style.borderColor = p === 'A' ? '#ff2a1f' : '#2f6bff';
  b.onclick = accion;
  return b;
}

function elegirSaque(paso, p, j) {
  if (paso === 1) {
    saqueTmp = { eq: p, jug: { A: 0, B: 0 } };
    saqueTmp.jug[p] = j;
    abrirSaque(2, p);
  } else {
    saqueTmp.jug[p] = j;
    S.saque = saqueTmp;
    if (S.tb) S.tbIni = clonar(saqueTmp);
    saqueTmp = null;
    cerrarSaque();
    cambiar();
  }
}

function cerrarSaque() { $('ventanaSaque').classList.remove('abierto'); }

// ----- Cambio de cancha, voz, pantalla completa -----
function alternarCambio() {
  S.cc = !S.cc;
  guardarLocal('cambioCancha', S.cc ? 'si' : 'no');
  if (!S.cc) S.cambio = false;
  cambiar();
}

function alternarVoz() {
  vozActiva = !vozActiva;
  guardarLocal('vozPadel', vozActiva ? 'si' : 'no');
  if (!vozActiva && typeof speechSynthesis !== 'undefined') speechSynthesis.cancel();
  pintarMenu();
}

function pantallaCompleta() {
  const d = document, el = d.documentElement;
  const activa = d.fullscreenElement || d.webkitFullscreenElement;
  try {
    if (!activa) {
      const f = el.requestFullscreen || el.webkitRequestFullscreen;
      const r = f && f.call(el);
      if (r && r.then && typeof bloquearHorizontal === 'function') r.then(bloquearHorizontal).catch(() => {});
    } else {
      (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    }
  } catch (e) {}
}
document.addEventListener('fullscreenchange', pintarMenu);
document.addEventListener('webkitfullscreenchange', pintarMenu);

// ----- Mantener la pantalla encendida -----
async function pantallaEncendida() {
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
}
pantallaEncendida();
document.addEventListener('visibilitychange', () => { if (!document.hidden) pantallaEncendida(); });


// Pareja a la que suma este mando ahora: se invierte en cada cambio de cancha
function parejaActual() { return (S.lados % 2 === 0) ? PAREJA : otro(PAREJA); }

function marcarMia() {
  const p = parejaActual();
  ['A', 'B'].forEach(x => {
    const on = x === p;
    $('caja' + x).classList.toggle('mio', on);
    $('fila' + x).classList.toggle('mio', on);
  });
}

function refrescar() {
  ['A', 'B'].forEach(p => {
    const t = textoPuntos(p);
    const corto = t === 'VENTAJA' ? 'AD' : t;
    $('puntos' + p).textContent = corto;
    $('tp' + p).textContent = corto;
    $('tj' + p).textContent = S.juegos[p];
    $('ts' + p).textContent = S.sets[p];
  });
  pintarNombres();
  pintarBola();
  marcarMia();
  $('cambio').style.display = S.cambio ? 'block' : 'none';
  pintarMenu();
}


// ===== CÁMARA: al acercar la pala al objetivo se suma el punto =====
// Se compara cada píxel con cómo se veía antes. Si casi toda la imagen se oscurece
// de golpe (la pala tapa el objetivo; los agujeros dejan pasar algo de luz) y
// se mantiene CAM_TAPADO_MS, cuenta un punto. Después hay un bloqueo de CAM_BLOQUEO_MS.
const CAM_W = 32, CAM_H = 24;
const CAM_TAPADO_MS = 300;      // tiempo que debe estar tapada la cámara
const CAM_BLOQUEO_MS = 2000;    // descanso después de cada punto
const CAM_RELEARN_MS = 4000;    // si queda tapada mucho rato, se vuelve a aprender la luz
// caida: un píxel cuenta como tapado si baja de esa fracción de su luz normal
// cuanto: fracción de píxeles tapados necesaria
const SENSIBILIDADES = { alta: { caida: 0.65, cuanto: 0.60 }, media: { caida: 0.50, cuanto: 0.70 }, baja: { caida: 0.35, cuanto: 0.80 } };

let camActiva = leerLocal('camPadel') !== 'no';
let sens = SENSIBILIDADES[leerLocal('sensPadel')] ? leerLocal('sensPadel') : 'media';
let camStream = null, camTimer = null, camBase = null, camLum = null;
let camDesde = 0, camArmado = true, camBloqueoHasta = 0, camFlash = null;
const camCanvas = document.createElement('canvas');
camCanvas.width = CAM_W; camCanvas.height = CAM_H;
const camCtx = camCanvas.getContext('2d', { willReadFrequently: true });

function textoCam(t) { $('camTexto').textContent = t; }

async function iniciarCamara() {
  if (!camActiva || camStream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    textoCam('LA CÁMARA NECESITA HTTPS'); return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } }, audio: false
    });
    const v = $('video');
    v.srcObject = camStream;
    await v.play();
    camBase = null; camDesde = 0; camArmado = true;
    camTimer = setInterval(analizarCamara, 50);
    textoCam('ACERCA LA PALA');
  } catch (e) {
    camStream = null;
    textoCam('SIN PERMISO DE CÁMARA · TOCA PARA REINTENTAR');
  }
}

function pararCamara() {
  if (camTimer) { clearInterval(camTimer); camTimer = null; }
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  $('video').srcObject = null;
  camBase = null;
  $('camara').classList.remove('tapando');
  $('camNivel').style.width = '0';
}

function analizarCamara() {
  const v = $('video');
  if (v.readyState < 2) return;
  camCtx.drawImage(v, 0, 0, CAM_W, CAM_H);
  const d = camCtx.getImageData(0, 0, CAM_W, CAM_H).data;
  const n = CAM_W * CAM_H;
  if (!camLum) camLum = new Float32Array(n);
  for (let i = 0; i < n; i++) camLum[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2] + 1;
  if (!camBase) { camBase = Float32Array.from(camLum); return; }

  const cfg = SENSIBILIDADES[sens];
  let tapados = 0;
  for (let i = 0; i < n; i++) if (camLum[i] < camBase[i] * cfg.caida) tapados++;
  const frac = tapados / n;
  const ahora = performance.now();
  const cubierto = frac >= cfg.cuanto;
  $('camNivel').style.width = Math.min(100, Math.round(frac * 100)) + '%';
  $('camara').classList.toggle('tapando', cubierto);

  if (!cubierto) {
    for (let i = 0; i < n; i++) camBase[i] += (camLum[i] - camBase[i]) * 0.05;  // sigue los cambios lentos de luz
    camDesde = 0;
    if (!camArmado && ahora > camBloqueoHasta) { camArmado = true; textoCam('ACERCA LA PALA'); }
  } else {
    if (!camDesde) camDesde = ahora;
    if (camArmado && ahora - camDesde >= CAM_TAPADO_MS) {
      camArmado = false;
      camBloqueoHasta = ahora + CAM_BLOQUEO_MS;
      puntoCamara();
    } else if (ahora - camDesde > CAM_RELEARN_MS) {
      camBase = Float32Array.from(camLum); camDesde = 0;   // cambio de luz permanente: reaprender
    }
  }
}

function puntoCamara() {
  // No sumar si hay una ventana o el menú abiertos
  if (document.querySelector('.ventana.abierto') || $('fondoMenu').classList.contains('abierto')) return;
  if (navigator.vibrate) navigator.vibrate(60);
  accionPunto(parejaActual());
  const c = $('camara');
  c.classList.add('punto');
  textoCam('¡PUNTO!');
  clearTimeout(camFlash);
  camFlash = setTimeout(() => { c.classList.remove('punto'); textoCam('ESPERA...'); }, 500);
}

function alternarCamara() {
  camActiva = !camActiva;
  guardarLocal('camPadel', camActiva ? 'si' : 'no');
  if (camActiva) { textoCam('ACTIVANDO CÁMARA...'); iniciarCamara(); }
  else { pararCamara(); textoCam('CÁMARA APAGADA · TOCA PARA ACTIVAR'); }
  pintarMenu();
}

function alternarSens() {
  const orden = ['baja', 'media', 'alta'];
  sens = orden[(orden.indexOf(sens) + 1) % orden.length];
  guardarLocal('sensPadel', sens);
  pintarMenu();
}

$('camara').addEventListener('click', () => {
  if (!camActiva) { camActiva = true; guardarLocal('camPadel', 'si'); pintarMenu(); }
  if (!camStream) { textoCam('ACTIVANDO CÁMARA...'); iniciarCamara(); }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const t = camStream && camStream.getVideoTracks()[0];
  if (camStream && (!t || t.readyState === 'ended')) { pararCamara(); iniciarCamara(); }
});

if (camActiva) iniciarCamara(); else textoCam('CÁMARA APAGADA · TOCA PARA ACTIVAR');


$('mas').addEventListener('click', () => {
  if (navigator.vibrate) navigator.vibrate(60);
  accionPunto(parejaActual());
});
$('menos').addEventListener('click', () => {
  if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
  deshacer();
});

iniciarMotor();
</script>
