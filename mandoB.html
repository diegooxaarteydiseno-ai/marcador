<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mando pareja B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  :root {
    --fondo: #020817;
    --fondo2: #071a3d;
    --verde: #8dff00;
    --celeste: #3d9bff;
    --ambar: #ffc400;
    --lima: #b8ff00;
    --tipo: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', Impact, sans-serif;
  }
  body { display: flex; flex-direction: column; background: radial-gradient(120% 60% at 50% 0%, #0c2a63 0%, rgba(12,42,99,0) 60%), linear-gradient(180deg, var(--fondo2) 0%, var(--fondo) 60%); color: #fff; font-family: var(--tipo); text-align: center; user-select: none; -webkit-user-select: none; overflow: hidden; }

  /* ===== Pelota de saque ===== */
  .bola { width: .8em; height: .8em; flex: none; visibility: hidden; filter: drop-shadow(0 0 5px #d4ff00); }
  .bola.on { visibility: visible; }
  .bola svg { width: 100%; height: 100%; display: block; }

  /* ===== Tres puntitos + menú desplegable ===== */
  #botonMenu { position: fixed; top: 12px; right: 12px; z-index: 20; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--verde); background: rgba(2,8,23,.8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; box-shadow: 0 0 10px rgba(141,255,0,.45); padding: 0; }
  #botonMenu span { width: 6px; height: 6px; border-radius: 50%; background: var(--verde); display: block; }
  #fondoMenu { position: fixed; inset: 0; z-index: 21; display: none; }
  #fondoMenu.abierto { display: block; }
  #listaMenu { position: absolute; top: 66px; right: 12px; background: #060d1d; border: 2px solid var(--verde); border-radius: 14px; box-shadow: 0 0 20px rgba(141,255,0,.45); overflow-y: auto; max-height: calc(100vh - 80px); min-width: 260px; max-width: calc(100vw - 24px); }
  #listaMenu button { display: block; width: 100%; text-align: left; padding: 11px 18px; font-size: 1.1rem; font-weight: 700; font-family: inherit; color: #fff; background: transparent; border: none; border-bottom: 1px solid #1b2a4a; cursor: pointer; letter-spacing: 1.5px; }
  #listaMenu button:last-child { border-bottom: none; }
  #listaMenu button:active { background: #12304a; }
  #listaMenu .reiniciar { color: #ff6b6b; }

  /* ===== Ventanas (nombres, saque y logo) ===== */
  .ventana { position: fixed; inset: 0; background: rgba(2,8,23,.95); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; z-index: 30; overflow: auto; }
  .ventana.abierto { display: flex; }
  .ventana h2 { margin: 0 0 6px; color: var(--verde); letter-spacing: 3px; text-shadow: 0 0 10px var(--verde); font-size: 1.6rem; }
  .grupo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(640px, 100%); }
  .grupo label { font-size: .9rem; color: #9db0d0; display: block; text-align: left; margin-bottom: 3px; }
  .grupo input { width: 100%; font-size: 1.3rem; padding: 10px; border-radius: 10px; border: 2px solid var(--verde); background: #000; color: #fff; font-family: inherit; }
  .ventana .cerrar { margin-top: 8px; background: var(--verde); color: #000; font-weight: 800; font-size: 1.3rem; padding: 12px 36px; border: none; border-radius: 12px; cursor: pointer; font-family: inherit; }
  .ventana .secundario { background: transparent; color: #9db0d0; border: 2px solid #34476b; }
  .elegir { display: grid; gap: 10px; width: min(640px, 100%); }
  .elegir button { font-size: 1.4rem; font-weight: 700; padding: 16px 10px; border-radius: 12px; border: 2px solid var(--verde); background: #000; color: #fff; font-family: inherit; text-transform: uppercase; cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
  .elegir button:active { background: #12304a; }
  #vistaLogo { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 18px rgba(141,255,0,.6); background: #000; }

  /* ===== Punto de conexión (verde = sincronizado) ===== */
  #conexion { position: fixed; top: 31px; right: 122px; z-index: 20; width: 9px; height: 9px; border-radius: 50%; background: #ff2a1f; box-shadow: 0 0 6px #ff2a1f; }
  #conexion.ok { background: #16a34a; box-shadow: 0 0 6px #16a34a; }

  /* ===== Botón de micrófono ===== */
  #botonMic { position: fixed; top: 12px; right: 66px; z-index: 20; width: 46px; height: 46px; border-radius: 50%; border: 2px solid #4b5b7a; background: rgba(2,8,23,.8); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  #botonMic svg { width: 24px; height: 24px; fill: #7f90b3; }
  #botonMic.on { border-color: var(--lima); box-shadow: 0 0 12px rgba(184,255,0,.8); animation: latido 1.4s ease-in-out infinite; }
  #botonMic.on svg { fill: var(--lima); }
  @keyframes latido { 0%, 100% { box-shadow: 0 0 6px rgba(184,255,0,.5); } 50% { box-shadow: 0 0 18px rgba(184,255,0,1); } }
  #avisoMic { position: fixed; top: 66px; left: 12px; right: 12px; z-index: 22; padding: 8px 12px; border-radius: 12px; background: rgba(2,8,23,.94); border: 2px solid var(--lima); color: #fff; font-size: 1.15rem; font-weight: 700; letter-spacing: 1px; display: none; text-transform: uppercase; }
  #avisoMic.on { display: block; }

  /* ===== Cabecera: logo + estado ===== */
  .cab { display: flex; align-items: center; gap: 12px; flex: none; padding: 10px 124px 8px 14px; min-height: 70px; }
  .logo { height: 52px; width: 52px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid var(--verde); box-shadow: 0 0 12px rgba(141,255,0,.55); -webkit-touch-callout: none; touch-action: manipulation; }
  .cab-info { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-start; gap: 10px; flex-wrap: wrap; }
  .chipPista { font-size: 1.05rem; font-weight: 800; letter-spacing: .14em; color: #06210f; background: var(--verde); border-radius: .4em; padding: 0 .55em; line-height: 1.5; }
  .chipPista:empty { display: none; }
  .subtitulo { font-size: 1.15rem; font-weight: 700; letter-spacing: .09em; color: var(--verde); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tbMando { display: none; padding: .02em .5em; border-radius: .3em; font-size: 1.5rem; font-weight: 800; letter-spacing: .06em; color: #1a1300; background: var(--ambar); box-shadow: 0 0 12px rgba(255,196,0,.8); animation: pulsoTB 1.2s ease-in-out infinite; }
  .tbMando.on { display: inline-block; }
  @keyframes pulsoTB { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .cambio { display: none; width: 34px; height: 34px; filter: drop-shadow(0 0 6px var(--verde)); animation: parpadeo 1s infinite; }
  .cambio svg { width: 100%; height: 100%; display: block; }
  @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* ===== Mini marcador: nombres | punto | sets ===== */
  .cuerpo { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) 86px var(--wSets); grid-template-rows: 22px auto auto; gap: 0 8px; padding: 0 12px;
    --wSets: calc(var(--n, 3) * 36px); }
  .cabSet { grid-column: 3; display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); align-items: end; font-size: .7rem; font-weight: 700; letter-spacing: .03em; color: var(--verde); text-shadow: 0 0 8px rgba(141,255,0,.5); }
  .cabSet div { white-space: nowrap; line-height: 1; min-width: 0; text-align: center; overflow: hidden; }
  .cabSet .tbmini { display: block; color: var(--ambar); text-shadow: none; font-size: .9em; }

  .eq { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 2px; margin: 5px 0; padding: 0 30px 0 12px; min-width: 0; text-align: left;
    border-left: 4px solid #22345a; border-radius: 4px 0 0 4px;
    background: linear-gradient(90deg, rgba(255,255,255,.07), rgba(255,255,255,0)); }
  .eq.mio { border-left-color: var(--verde); background: linear-gradient(90deg, rgba(141,255,0,.2), rgba(141,255,0,0)); box-shadow: -6px 0 14px -6px rgba(141,255,0,.7); }
  .eq div { display: flex; align-items: center; gap: .4em; font-size: 1.25rem; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; line-height: 1.1; }
  .eq div span { overflow: hidden; text-overflow: ellipsis; }
  /* Letra pequeña: P = esta pareja dice "punto", T = la otra dice "tanto" */
  .vl { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #4b5b7a; color: #8fa6cf; font-size: .72rem; font-weight: 800; line-height: 17px; text-align: center; }
  .eq.mio .vl { border-color: var(--verde); color: var(--verde); }

  .punto { position: relative; margin: 5px 0; display: flex; align-items: center; justify-content: center; border-radius: 9px; color: #0a0a0a; font-weight: 800; line-height: 1; font-size: 3.1rem; min-height: 80px; overflow: hidden;
    background: linear-gradient(180deg, #ffffff 0%, #ececec 49.2%, #bdbdbd 49.4%, #e6e6e6 50.6%, #f7f7f7 100%);
    box-shadow: 0 5px 10px rgba(0,0,0,.65), inset 0 0 8px rgba(0,0,0,.16); }
  .punto::before { content: ''; position: absolute; left: 0; right: 0; top: 49.4%; height: 3px; background: rgba(0,0,0,.5); }
  .punto span { position: relative; z-index: 1; transform: translateY(-.02em); }
  .punto.ad { font-size: 2.5rem; }

  .sets { margin: 5px 0; display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); }
  .sets div { display: flex; align-items: center; justify-content: center; font-size: 2.1rem; font-weight: 800; line-height: 1; color: #fff; text-shadow: 0 0 8px rgba(255,255,255,.3); }
  .sets div.futuro { color: var(--celeste); text-shadow: 0 0 8px rgba(61,155,255,.35); }
  .sets div.actual { text-shadow: 0 0 14px rgba(141,255,0,.85), 0 0 3px #fff; }
  .sets div.pierde { color: #b7c3dc; text-shadow: none; }

  /* ===== Cronómetro ===== */
  .pie { flex: none; display: flex; align-items: baseline; justify-content: flex-end; gap: 10px; margin: 4px 12px 0; padding: 4px 4px 0; border-top: 2px solid var(--verde); box-shadow: 0 -4px 12px rgba(141,255,0,.2); }
  .pie small { font-size: .85rem; font-weight: 700; letter-spacing: .2em; color: var(--verde); }
  .pie b { font-size: 1.7rem; font-weight: 800; letter-spacing: .06em; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px rgba(255,255,255,.35); }

  /* ===== Cámara: vista previa pequeña para apuntar la pala, con luz de estado ===== */
  .camara { position: relative; flex: 1 1 auto; min-height: 120px; max-height: 300px; margin: 10px 12px 0; border-radius: 16px; overflow: hidden; border: 2px solid #2a4a2a; background: #040d1c; display: flex; align-items: flex-end; cursor: pointer; transition: background .15s ease, border-color .15s ease; }
  .camara video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: .9; }
  .camTexto { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 14px 12px; font-size: 1.05rem; font-weight: 700; letter-spacing: .14em; color: #fff; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(0deg, rgba(2,8,23,.85), rgba(2,8,23,0)); text-shadow: 0 1px 4px #000; }
  .camTexto::before { content: ''; width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--verde); box-shadow: 0 0 10px var(--verde); }
  .camBarra { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255,255,255,.12); z-index: 2; }
  .camBarra i { display: block; height: 100%; width: 0; background: var(--verde); }
  .camara.tapando { border-color: var(--ambar); }
  .camara.tapando .camTexto::before { background: var(--ambar); box-shadow: 0 0 12px var(--ambar); }
  .camara.ignorado { border-color: #6b7a99; }
  .camara.ignorado .camTexto::before { background: #6b7a99; box-shadow: none; }
  .camara.punto { background: var(--lima); border-color: #fff; }
  .camara.punto video { opacity: .15; }
  .camara.punto .camTexto { color: #06210f; background: none; text-shadow: none; font-size: 2rem; justify-content: center; padding-bottom: 40px; }
  .camara.punto .camTexto::before { display: none; }

  /* ===== Botones 3D: más en verde limón, menos en azul oscuro con borde blanco ===== */
  .botones { flex: 0 0 auto; height: clamp(84px, 15vh, 130px); display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 12px 22px; }
  .mas, .menos { position: relative; border: none; font-family: 'Arial Black', Arial, sans-serif; line-height: 1; cursor: pointer; overflow: hidden; touch-action: manipulation; width: 100%; height: 100%; margin: 0; border-radius: 22px; transition: transform .07s ease, box-shadow .07s ease, filter .07s ease; }
  .mas::before, .menos::before { content: ''; position: absolute; left: 4%; right: 4%; top: 2%; height: 42%; border-radius: 50% 50% 50% 50% / 100% 100% 60% 60%; background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 70%, rgba(255,255,255,0) 100%); pointer-events: none; }
  .mas::after, .menos::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: 3%; height: 14%; border-radius: 50%; background: linear-gradient(0deg, rgba(255,255,255,.22), rgba(255,255,255,0)); pointer-events: none; }

  .mas { font-size: 4rem; color: #06210f;
    background: radial-gradient(120% 90% at 50% 0%, #f1ff9a 0%, #c8ff1a 30%, #8fd400 68%, #4d7d00 100%);
    text-shadow: 0 2px 0 rgba(255,255,255,.45), 0 0 14px rgba(230,255,140,.45);
    box-shadow:
      inset 0 3px 2px rgba(255,255,255,.7),
      inset 0 -10px 18px rgba(40,70,0,.55),
      inset 6px 0 14px rgba(60,100,0,.3),
      inset -6px 0 14px rgba(60,100,0,.3),
      0 10px 0 #3f6b00,
      0 14px 0 #2a4a00,
      0 22px 28px rgba(0,0,0,.85),
      0 0 24px rgba(184,255,0,.35); }
  .mas:active { transform: translateY(8px);
    box-shadow:
      inset 0 3px 2px rgba(255,255,255,.45),
      inset 0 -6px 14px rgba(40,70,0,.6),
      inset 0 10px 22px rgba(30,50,0,.45),
      0 2px 0 #3f6b00,
      0 4px 0 #2a4a00,
      0 8px 12px rgba(0,0,0,.8),
      0 0 14px rgba(184,255,0,.25);
    filter: brightness(.94); }
  .menos { font-size: 3.4rem; color: #fff; border: 3px solid #fff;
    background: radial-gradient(120% 110% at 50% 0%, #3b66c4 0%, #1d3f85 32%, #0f2859 70%, #071634 100%);
    text-shadow: 0 -2px 0 rgba(255,255,255,.2), 0 4px 6px rgba(0,0,0,.55), 0 0 12px rgba(160,200,255,.35);
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.55),
      inset 0 -7px 12px rgba(0,10,40,.65),
      inset 4px 0 10px rgba(0,10,50,.35),
      inset -4px 0 10px rgba(0,10,50,.35),
      0 7px 0 #04122c,
      0 10px 0 #020a1a,
      0 16px 20px rgba(0,0,0,.85),
      0 0 18px rgba(61,155,255,.3); }
  .menos:active { transform: translateY(6px);
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.35),
      inset 0 -4px 10px rgba(0,10,40,.7),
      inset 0 8px 16px rgba(0,5,30,.5),
      0 1px 0 #04122c,
      0 3px 0 #020a1a,
      0 6px 9px rgba(0,0,0,.8),
      0 0 10px rgba(61,155,255,.2);
    filter: brightness(.94); }
</style>
</head>
<body>

<div class="cab">
  <img class="logo" id="logo" src="logo.jpg" alt="Logo" onerror="this.style.display='none'" oncontextmenu="return false">
  <div class="cab-info">
    <span class="chipPista" id="chipPista"></span>
    <div class="subtitulo" id="subtitulo">&nbsp;</div>
    <span class="tbMando" id="tbMando">T.B.</span>
    <span class="cambio" id="cambio">
      <svg viewBox="0 0 100 100" fill="none" stroke="#8dff00" stroke-width="9" stroke-linecap="round">
        <path d="M 22 50 A 28 28 0 0 1 78 50"/>
        <path d="M 78 50 A 28 28 0 0 1 22 50"/>
        <polygon points="66,46 90,46 78,62" fill="#8dff00" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="10,54 34,54 22,38" fill="#8dff00" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </span>
  </div>
</div>

<div class="cuerpo" id="cuerpo">
  <div></div><div></div><div class="cabSet" id="cabSet"></div>

  <div class="eq" id="eqA">
    <div id="nA0"><i class="bola"></i><span></span></div>
    <div id="nA1"><i class="bola"></i><span></span></div>
    <span class="vl" id="vlA">P</span>
  </div>
  <div class="punto" id="puntosA"><span>0</span></div>
  <div class="sets" id="setsA"></div>

  <div class="eq" id="eqB">
    <div id="nB0"><i class="bola"></i><span></span></div>
    <div id="nB1"><i class="bola"></i><span></span></div>
    <span class="vl" id="vlB">T</span>
  </div>
  <div class="punto" id="puntosB"><span>0</span></div>
  <div class="sets" id="setsB"></div>
</div>

<div class="pie"><small>TIEMPO</small><b id="crono">00:00:00</b></div>

<div class="camara" id="camara">
  <video id="video" playsinline muted autoplay></video>
  <div class="camTexto" id="camTexto">TOCA PARA ACTIVAR LA CÁMARA</div>
  <div class="camBarra"><i id="camNivel"></i></div>
</div>

<div class="botones">
  <button class="menos" id="menos">−</button>
  <button class="mas" id="mas">+</button>
</div>

<div id="conexion" title="Conexión"></div>
<button id="botonMic" onclick="alternarMic()" aria-label="Micrófono: decir punto o tanto">
  <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
</button>
<div id="avisoMic"></div>
<button id="botonMenu" onclick="abrirListaMenu()" aria-label="Menú"><span></span><span></span><span></span></button>

<div id="fondoMenu" onclick="cerrarListaMenu()">
  <div id="listaMenu" onclick="event.stopPropagation()">
    <button onclick="cerrarListaMenu(); abrirNombres()">NOMBRES</button>
    <button onclick="cerrarListaMenu(); abrirSaque(1)">QUIÉN SACA</button>
    <button id="botonCambio" onclick="alternarCambio(); cerrarListaMenu()">CAMBIO DE CANCHA: SÍ</button>
    <button id="botonVoz" onclick="alternarVoz(); cerrarListaMenu()">VOZ: SÍ</button>
    <button id="botonPista" onclick="cerrarListaMenu(); abrirPista()">PISTA · CAMBIAR</button>
    <button id="botonCamara" onclick="alternarCamara(); cerrarListaMenu()">CÁMARA: SÍ</button>
    <button id="botonSens" onclick="alternarSens()">SENSIBILIDAD: ALTA</button>
    <button onclick="cerrarListaMenu(); abrirLogo()">CAMBIAR LOGO</button>
    <button id="botonPantalla" onclick="pantallaCompleta(); cerrarListaMenu()">PANTALLA COMPLETA</button>
    <button onclick="deshacer(); cerrarListaMenu()">DESHACER</button>
    <button class="reiniciar" onclick="cerrarListaMenu(); reiniciar()">REINICIAR</button>
  </div>
</div>

<div id="menu" class="ventana">
  <h2>NOMBRES</h2>
  <div class="grupo">
    <div><label>Pareja A · jugador 1</label><input id="iA1" maxlength="14"></div>
    <div><label>Pareja B · jugador 1</label><input id="iB1" maxlength="14"></div>
    <div><label>Pareja A · jugador 2</label><input id="iA2" maxlength="14"></div>
    <div><label>Pareja B · jugador 2</label><input id="iB2" maxlength="14"></div>
  </div>
  <button class="cerrar" onclick="guardarNombres()">GUARDAR</button>
</div>

<div id="ventanaPista" class="ventana">
  <h2>ELEGIR PISTA</h2>
  <div class="elegir" id="opcionesPista"></div>
  <button class="cerrar secundario" id="cancelarPista" onclick="cerrarPista()">CANCELAR</button>
</div>

<div id="ventanaSaque" class="ventana">
  <h2 id="tituloSaque">¿QUIÉN SACA PRIMERO?</h2>
  <div class="elegir" id="opcionesSaque"></div>
  <button class="cerrar secundario" onclick="cerrarSaque()">CANCELAR</button>
</div>

<div id="ventanaLogo" class="ventana">
  <h2>EDITAR LOGO</h2>
  <img id="vistaLogo" alt="Logo actual">
  <div class="elegir">
    <button onclick="$('archivoLogo').click()">CARGAR UNA IMAGEN NUEVA</button>
    <button onclick="quitarLogo()">VOLVER AL LOGO ORIGINAL</button>
  </div>
  <input type="file" id="archivoLogo" accept="image/*" style="display:none">
  <div id="msgLogo" style="color:#9db0d0;font-size:1.1rem;min-height:1.3em"></div>
  <button class="cerrar secundario" onclick="cerrarLogo()">CERRAR</button>
</div>

<script>
// ====== CONFIGURACIÓN DE ESTE MANDO ======
const PAREJA = 'B';
const VOZ_DEFECTO = false;   // en los mandos la voz empieza apagada (habla el marcador); se activa desde el menú
// =========================================

// ===== MOTOR COMPARTIDO: marcador y mandos usan exactamente este código =====
// El partido vive en Firebase (/partido). Cada aparato aplica la jugada, y la envía.
// El logo personalizado vive aparte (/logo) para no reenviarlo en cada punto.
function leerLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function guardarLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function clonar(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }
function otro(p) { return p === 'A' ? 'B' : 'A'; }
const DB_URL = 'https://marcadoroxa-default-rtdb.europe-west1.firebasedatabase.app';
const RUTA_LOGO = DB_URL + '/logo.json';            // el logo es común a todas las pistas
const PISTAS = 5;                                    // cada pista tiene su propio partido: /pistas/N/partido
function rutaDe(n) { return DB_URL + '/pistas/' + n + '/partido.json'; }
let PISTA = parseInt(leerLocal('pistaPadel'), 10) || 0;
if (PISTA < 1 || PISTA > PISTAS) PISTA = 0;
let RUTA = PISTA ? rutaDe(PISTA) : '';
const ESCALA = [0, 15, 30, 40];
const NOMBRES_DEF = { A: ['Jugador 1', 'Jugador 2'], B: ['Jugador 3', 'Jugador 4'] };
const MAX_HIST = 30;


function nombresIniciales() {
  try { const g = JSON.parse(leerLocal('nombresPadel')); if (g && g.A && g.B) return g; } catch (e) {}
  return clonar(NOMBRES_DEF);
}

// tb = true mientras se juega el último juego a 6-6 (juego decisivo, se muestra "T.B.")
// ini = hora (ms) en que empezó el partido, la comparten todos los aparatos
function partidoNuevo(nombres, cc) {
  return { v: 0, pts: {A: 0, B: 0}, juegos: {A: 0, B: 0}, sets: {A: 0, B: 0},
           saque: null, tb: false, cambio: false, lados: 0, hist: [], ant: [], ini: 0,
           nombres: nombres, cc: cc, msg: '', dicho: '' };
}

let S = partidoNuevo(nombresIniciales(), leerLocal('cambioCancha') !== 'no');
let vozActiva = leerLocal('vozPadel') ? leerLocal('vozPadel') === 'si' : VOZ_DEFECTO;

// Firebase quita los vacíos (listas [] y null): se rellenan al recibir
function normalizar(d) {
  const par = o => ({ A: (o && o.A) || 0, B: (o && o.B) || 0 });
  const saque = s => s ? { eq: s.eq, jug: par(s.jug) } : null;
  const nom = (x, def) => [ (x && x[0]) || def[0], (x && x[1]) || def[1] ];
  const r = {};
  r.v = d.v || 0;
  r.pts = par(d.pts); r.juegos = par(d.juegos); r.sets = par(d.sets);
  r.saque = saque(d.saque);
  r.tb = !!d.tb;
  r.cambio = !!d.cambio;
  r.lados = d.lados || 0;
  r.ini = d.ini || 0;
  r.ant = Array.isArray(d.ant) ? d.ant : (d.ant ? Object.values(d.ant) : []);
  r.hist = Array.isArray(d.hist) ? d.hist : (d.hist ? Object.values(d.hist) : []);
  r.nombres = { A: nom(d.nombres && d.nombres.A, NOMBRES_DEF.A), B: nom(d.nombres && d.nombres.B, NOMBRES_DEF.B) };
  r.cc = d.cc !== false;
  r.msg = d.msg || '';
  r.dicho = d.dicho || '';
  return r;
}

// ===== Voz (el aparato habla) =====
function hablar(texto) {
  if (!vozActiva || !texto || typeof speechSynthesis === 'undefined') return;
  try {
    if (typeof alHablar === 'function') alHablar();   // el micrófono no debe oír esta voz
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'es-ES';
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ===== Textos =====
function nombrePareja(p) { return S.nombres[p][0] + ' y ' + S.nombres[p][1]; }

// Texto del punto de cada pareja (VENTAJA se muestra como AD donde falta espacio)
// El juego decisivo de 6-6 se cuenta igual que cualquier otro: 15, 30, 40, iguales, ventaja.
function textoPuntos(p) {
  const a = S.pts[p], b = S.pts[otro(p)];
  if (a >= 3 && b >= 3) {
    if (a === b) return '40';
    return a > b ? 'VENTAJA' : '40';
  }
  return String(ESCALA[a]);
}

function frasePuntos() {
  const a = S.pts.A, b = S.pts.B;
  // El tanteo se canta empezando por la pareja que saca (15-0, 0-15...)
  const sc = sacador();
  const p1 = sc ? sc.eq : 'A', p2 = otro(p1);
  const x = S.pts[p1], y = S.pts[p2];
  if (a >= 3 && b >= 3) {
    if (a === b) return 'Iguales';
    return 'Ventaja ' + nombrePareja(a > b ? 'A' : 'B');
  }
  return ESCALA[x] + ' ' + ESCALA[y];
}

// ===== Saque =====
// S.saque = { eq: pareja que saca, jug: { A: jugador (0/1) que saca cuando saca A, B: igual } }
function sacador() {
  const s = S.saque;
  if (!s) return null;
  return { eq: s.eq, j: s.jug[s.eq] };
}

// ===== Jugadas =====
function instantanea() {
  return JSON.stringify({ pts: S.pts, juegos: S.juegos, sets: S.sets, saque: S.saque, tb: S.tb, cambio: S.cambio, lados: S.lados, ant: S.ant });
}

function terminar(msg, dicho) {
  S.v++;
  S.msg = msg;
  S.dicho = dicho;
  refrescar();
  hablar(dicho);
  publicar();
}

// Cambio sin voz (nombres, saque, cambio de cancha sí/no)
function cambiar() {
  S.v++;
  S.dicho = '';
  refrescar();
  publicar();
}

function accionPunto(p) {
  S.hist.push(instantanea());
  if (S.hist.length > MAX_HIST) S.hist.shift();
  if (!S.ini) S.ini = Date.now();            // por si nadie eligió quién saca: empieza con el primer punto
  const q = otro(p);
  let msg = '', dicho = '', cambio = false;
  S.cambio = false;
  S.pts[p]++;

  if (S.pts[p] >= 4 && S.pts[p] - S.pts[q] >= 2) {
    // ===== Gana el juego =====
    const eraDecisivo = S.tb;
    S.pts = {A: 0, B: 0};
    S.juegos[p]++;
    msg = 'JUEGO ' + nombrePareja(p).toUpperCase();
    dicho = 'Juego ' + nombrePareja(p) + '. Juegos, ' + S.juegos.A + ' ' + S.juegos.B;

    // El saque pasa a la otra pareja; quien sacó, la próxima vez sacará su compañero
    if (S.saque) {
      S.saque.jug[S.saque.eq] ^= 1;
      S.saque.eq = otro(S.saque.eq);
    }

    const jp = S.juegos[p], jq = S.juegos[q];
    const total = jp + jq;
    if (eraDecisivo || (jp >= 6 && jp - jq >= 2)) {
      // Gana el set (el juego decisivo de 6-6 lo cierra 7-6)
      S.sets[p]++;
      S.ant.push({ A: S.juegos.A, B: S.juegos.B, tb: eraDecisivo ? 1 : 0 });
      S.juegos = {A: 0, B: 0};
      S.tb = false;
      msg = 'SET ' + nombrePareja(p).toUpperCase();
      dicho = 'Set ' + nombrePareja(p) + '. Sets, ' + S.sets.A + ' ' + S.sets.B;
      if (total % 2 === 1) cambio = true;
    } else if (jp === 6 && jq === 6) {
      // Seis iguales: último juego decisivo
      S.tb = true;
      msg = 'T.B.';
      dicho += '. Tie-break';
    } else if (total % 2 === 1) {
      cambio = true;  // juegos impares: 1, 3, 5, 7, 9, 11
    }
  } else {
    dicho = frasePuntos();
  }

  if (cambio && S.cc) {
    S.cambio = true;
    S.lados++;
    dicho += '. Cambio de cancha';
  }
  terminar(msg, dicho);
}

function deshacer() {
  if (!S.hist.length) return;
  Object.assign(S, JSON.parse(S.hist.pop()));
  terminar('', 'Anulado. ' + frasePuntos());
}

function reiniciar() {
  if (typeof confirm === 'function' && !confirm('¿Reiniciar todo el marcador?')) return;
  const v = S.v + 1;
  guardarLocal('nombresPadel', '');   // olvidar los nombres guardados en este móvil
  S = partidoNuevo(clonar(NOMBRES_DEF), S.cc);
  S.v = v;
  S.dicho = 'Marcador reiniciado';
  refrescar();
  hablar(S.dicho);
  publicar();
  abrirSaque(1);
}

// ===== Cronómetro: cuenta desde que se eligió quién saca =====
function textoCrono() {
  if (!S.ini) return '00:00:00';
  let s = Math.max(0, Math.floor((Date.now() - S.ini) / 1000));
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  const dos = n => (n < 10 ? '0' : '') + n;
  return dos(h) + ':' + dos(m) + ':' + dos(s);
}

// ===== Sincronización con Firebase =====
let enviando = false, pendiente = false, arrancado = false;

function conexion(ok) { if (typeof alConexion === 'function') alConexion(ok); }

function publicar() {
  pendiente = true;
  if (!enviando) enviar();
}

function enviar() {
  if (!RUTA) return;
  enviando = true;
  pendiente = false;
  fetch(RUTA, { method: 'PUT', body: JSON.stringify(S) })
    .then(r => { if (!r.ok) throw new Error('http'); conexion(true); })
    .catch(() => conexion(false))
    .then(() => { enviando = false; if (pendiente) enviar(); });
}

// Al abrir: si el partido no tiene saque elegido, se pregunta quién saca
function arranque() {
  if (arrancado || !PISTA) return;
  arrancado = true;
  if (!S.saque) abrirSaque(1);
}

function recibir(d) {
  if (!d) { arranque(); return; }
  const r = normalizar(d);
  if (r.v > S.v) {
    const hablarlo = arrancado && r.dicho;
    S = r;
    refrescar();
    if (typeof alRecibir === 'function') alRecibir();   // los avisos de otro aparato no cuentan como punto por voz
    if (hablarlo) hablar(r.dicho);
  } else if (r.v < S.v && !enviando) {
    publicar();  // este aparato va por delante (p. ej. jugó sin conexión)
  }
  arranque();
}

function descargar() {
  if (!RUTA) return;
  const ruta = RUTA;
  fetch(ruta).then(r => r.json()).then(d => { if (ruta === RUTA) recibir(d); }).catch(() => conexion(false));
}

let esPartido = null;
function conectar() {
  if (!RUTA) return;
  let es;
  try { es = new EventSource(RUTA); } catch (e) { return; }
  esPartido = es;
  es.addEventListener('put', ev => {
    conexion(true);
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.path === '/') recibir(m.data); else descargar();
  });
  es.addEventListener('patch', () => descargar());
  es.onerror = () => conexion(false);
}

// ===== Logo personalizado (se cambia en un mando y se ve en los tres) =====
let logoURL = leerLocal('logoPadel') || '';

function aplicarLogo() {
  document.querySelectorAll('img.logo').forEach(i => {
    i.style.display = '';
    i.src = logoURL || 'logo.jpg';
  });
}

function recibirLogo(v) {
  const nuevo = (typeof v === 'string' && v.indexOf('data:image') === 0) ? v : '';
  if (nuevo === logoURL) return;
  logoURL = nuevo;
  guardarLocal('logoPadel', logoURL);
  aplicarLogo();
}

function guardarLogo(dataURL) {
  recibirLogo(dataURL);
  fetch(RUTA_LOGO, { method: 'PUT', body: JSON.stringify(dataURL || null) })
    .then(r => { if (!r.ok) throw new Error('http'); conexion(true); })
    .catch(() => conexion(false));
}

// Convierte la imagen elegida en un cuadrado de 256 px (ligero y válido para el círculo del logo)
function procesarLogo(archivo, alTerminar) {
  if (!archivo) return;
  const url = URL.createObjectURL(archivo);
  const img = new Image();
  img.onload = () => {
    const T = 256, c = document.createElement('canvas');
    c.width = c.height = T;
    const g = c.getContext('2d');
    g.fillStyle = '#020817';
    g.fillRect(0, 0, T, T);
    const lado = Math.min(img.width, img.height);
    g.drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, T, T);
    URL.revokeObjectURL(url);
    guardarLogo(c.toDataURL('image/jpeg', 0.85));
    if (alTerminar) alTerminar(true);
  };
  img.onerror = () => { URL.revokeObjectURL(url); if (alTerminar) alTerminar(false); };
  img.src = url;
}

function conectarLogo() {
  aplicarLogo();
  fetch(RUTA_LOGO).then(r => r.json()).then(recibirLogo).catch(() => {});
  let es;
  try { es = new EventSource(RUTA_LOGO); } catch (e) { return; }
  es.addEventListener('put', ev => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.path === '/') recibirLogo(m.data);
  });
}

function iniciarMotor() {
  refrescar();
  if (PISTA) conectar(); else abrirPista();
  conectarLogo();
  setInterval(() => { if (typeof alTick === 'function') alTick(); }, 500);
  setTimeout(arranque, 4000);   // sin conexión: se juega igualmente en local
}

// ===== Historial de sets terminados: 7-6 T.B., 6-0, ... =====
function textoHistorial() {
  return (S.ant || []).map(r => r.A + '-' + r.B + (r.tb ? ' T.B.' : ''));
}

// ===== INTERFAZ COMPARTIDA: menú de tres puntitos, nombres, saque, pantalla completa =====
const $ = id => document.getElementById(id);

const BOLA_SVG = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#d4ff00" stroke="#9bbd00" stroke-width="3"/><path d="M 10 28 C 38 40 38 60 10 72" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M 90 28 C 62 40 62 60 90 72" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>';
document.querySelectorAll('.bola').forEach(b => { b.innerHTML = BOLA_SVG; });

function alConexion(ok) { $('conexion').classList.toggle('ok', !!ok); }

// ----- Menú -----
function abrirListaMenu() { pintarMenu(); $('fondoMenu').classList.add('abierto'); }
function cerrarListaMenu() { $('fondoMenu').classList.remove('abierto'); }

function pintarMenu() {
  $('botonCambio').textContent = 'CAMBIO DE CANCHA: ' + (S.cc ? 'SÍ' : 'NO');
  $('botonVoz').textContent = 'VOZ: ' + (vozActiva ? 'SÍ' : 'NO');
  const activa = document.fullscreenElement || document.webkitFullscreenElement;
  $('botonPantalla').textContent = activa ? 'SALIR DE PANTALLA COMPLETA' : 'PANTALLA COMPLETA';
  if ($('botonPista')) $('botonPista').textContent = 'PISTA ' + (PISTA || '-') + ' · CAMBIAR';
  if ($('pistaNum')) $('pistaNum').textContent = PISTA || '';
  if ($('chipPista')) $('chipPista').textContent = PISTA ? 'PISTA ' + PISTA : '';
  if (typeof pintarMenuExtra === 'function') pintarMenuExtra();
}

// ----- Nombres y pelota de saque -----
function pintarNombres() {
  ['A', 'B'].forEach(p => {
    for (let j = 0; j < 2; j++) $('n' + p + j).querySelector('span').textContent = S.nombres[p][j];
  });
}

function pintarBola() {
  const s = sacador();
  ['A', 'B'].forEach(p => {
    for (let j = 0; j < 2; j++) {
      const on = !!s && s.eq === p && s.j === j;
      $('n' + p + j).querySelector('.bola').classList.toggle('on', on);
    }
  });
}

function abrirNombres() {
  $('iA1').value = S.nombres.A[0];
  $('iA2').value = S.nombres.A[1];
  $('iB1').value = S.nombres.B[0];
  $('iB2').value = S.nombres.B[1];
  $('menu').classList.add('abierto');
}

function guardarNombres() {
  const v = id => $(id).value.trim();
  S.nombres = {
    A: [v('iA1') || 'Jugador 1', v('iA2') || 'Jugador 2'],
    B: [v('iB1') || 'Jugador 3', v('iB2') || 'Jugador 4']
  };
  guardarLocal('nombresPadel', JSON.stringify(S.nombres));
  $('menu').classList.remove('abierto');
  cambiar();
}

// ----- Quién saca -----
let saqueTmp = null;

function abrirSaque(paso, eqPrimero) {
  const caja = $('opcionesSaque');
  caja.innerHTML = '';
  caja.style.gridTemplateColumns = '1fr 1fr';
  if (paso === 1) {
    $('tituloSaque').textContent = '¿QUIÉN SACA PRIMERO?';
    [0, 1].forEach(j => ['A', 'B'].forEach(p => {
      caja.appendChild(botonJugador(p, j, () => elegirSaque(1, p, j)));
    }));
  } else {
    $('tituloSaque').textContent = '¿QUIÉN SACA DE LA OTRA PAREJA?';
    const q = otro(eqPrimero);
    [0, 1].forEach(j => caja.appendChild(botonJugador(q, j, () => elegirSaque(2, q, j))));
  }
  $('ventanaSaque').classList.add('abierto');
}

function botonJugador(p, j, accion) {
  const b = document.createElement('button');
  b.textContent = S.nombres[p][j];
  b.style.borderColor = p === 'A' ? '#ff2a1f' : '#2f6bff';
  b.onclick = accion;
  return b;
}

function elegirSaque(paso, p, j) {
  if (paso === 1) {
    saqueTmp = { eq: p, jug: { A: 0, B: 0 } };
    saqueTmp.jug[p] = j;
    abrirSaque(2, p);
  } else {
    saqueTmp.jug[p] = j;
    S.saque = saqueTmp;
    if (!S.ini) S.ini = Date.now();     // aquí empieza el partido y el cronómetro
    saqueTmp = null;
    cerrarSaque();
    cambiar();
  }
}


// ----- Pista: cada pista tiene su propio partido (hasta 5) -----
function abrirPista() {
  const caja = $('opcionesPista');
  caja.innerHTML = '';
  caja.style.gridTemplateColumns = 'repeat(5, 1fr)';
  for (let n = 1; n <= PISTAS; n++) {
    const b = document.createElement('button');
    b.textContent = n;
    b.style.fontSize = '2.4rem';
    if (n === PISTA) { b.style.background = '#8dff00'; b.style.color = '#000'; }
    b.onclick = () => elegirPista(n);
    caja.appendChild(b);
  }
  $('cancelarPista').style.display = PISTA ? '' : 'none';   // la primera vez hay que elegir una
  $('ventanaPista').classList.add('abierto');
}

function cerrarPista() { $('ventanaPista').classList.remove('abierto'); }

function elegirPista(n) {
  if (n === PISTA) { cerrarPista(); return; }
  PISTA = n;
  guardarLocal('pistaPadel', String(n));
  RUTA = rutaDe(n);
  if (esPartido) { try { esPartido.close(); } catch (e) {} esPartido = null; }
  S = partidoNuevo(nombresIniciales(), S.cc);   // el partido de esta pista llegará de Firebase
  enviando = false; pendiente = false; arrancado = false;
  cerrarPista();
  refrescar();
  conectar();
  setTimeout(arranque, 4000);
}

function cerrarSaque() { $('ventanaSaque').classList.remove('abierto'); }

// ----- Cambio de cancha, voz, pantalla completa -----
function alternarCambio() {
  S.cc = !S.cc;
  guardarLocal('cambioCancha', S.cc ? 'si' : 'no');
  if (!S.cc) S.cambio = false;
  cambiar();
}

function alternarVoz() {
  vozActiva = !vozActiva;
  guardarLocal('vozPadel', vozActiva ? 'si' : 'no');
  if (!vozActiva && typeof speechSynthesis !== 'undefined') speechSynthesis.cancel();
  pintarMenu();
}

function pantallaCompleta() {
  const d = document, el = d.documentElement;
  const activa = d.fullscreenElement || d.webkitFullscreenElement;
  try {
    if (!activa) {
      const f = el.requestFullscreen || el.webkitRequestFullscreen;
      const r = f && f.call(el);
      if (r && r.then && typeof bloquearHorizontal === 'function') r.then(bloquearHorizontal).catch(() => {});
    } else {
      (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    }
  } catch (e) {}
}
document.addEventListener('fullscreenchange', pintarMenu);
document.addEventListener('webkitfullscreenchange', pintarMenu);

// ----- Mantener la pantalla encendida -----
async function pantallaEncendida() {
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
}
pantallaEncendida();
document.addEventListener('visibilitychange', () => { if (!document.hidden) pantallaEncendida(); });


// Pareja a la que suma este mando ahora: se invierte en cada cambio de cancha
function parejaActual() { return (S.lados % 2 === 0) ? PAREJA : otro(PAREJA); }

// Marca la pareja del lado de este mando (la que dice "punto", letra P); la otra dice "tanto" (T)
function marcarMia() {
  const p = parejaActual();
  ['A', 'B'].forEach(x => {
    const on = x === p;
    $('eq' + x).classList.toggle('mio', on);
    $('vl' + x).textContent = on ? 'P' : 'T';
  });
}

function pintarPuntos(p) {
  const t = textoPuntos(p);
  const el = $('puntos' + p);
  el.querySelector('span').textContent = t === 'VENTAJA' ? 'AD' : t;
  el.classList.toggle('ad', t === 'VENTAJA');
}

// Columnas de sets: terminados (blanco), el actual (brillo) y los que faltan (azul)
function pintarSets() {
  const ant = S.ant || [];
  const n = Math.max(3, Math.min(5, ant.length + 1));
  $('cuerpo').style.setProperty('--n', n);
  let cab = '', fa = '', fb = '';
  for (let i = 0; i < n; i++) {
    let a, b, ca = '', cb = '', tb = false;
    if (i < ant.length) {
      a = ant[i].A; b = ant[i].B; tb = !!ant[i].tb;
      ca = a > b ? 'gana' : 'pierde'; cb = b > a ? 'gana' : 'pierde';
    } else if (i === ant.length) {
      a = S.juegos.A; b = S.juegos.B; ca = cb = 'actual';
      tb = S.tb;
    } else {
      a = 0; b = 0; ca = cb = 'futuro';
    }
    cab += '<div>SET ' + (i + 1) + (tb ? '<span class="tbmini">T.B.</span>' : '') + '</div>';
    fa += '<div class="' + ca + '">' + a + '</div>';
    fb += '<div class="' + cb + '">' + b + '</div>';
  }
  $('cabSet').innerHTML = cab;
  $('setsA').innerHTML = fa;
  $('setsB').innerHTML = fb;
}

// ===== Logo: mantener pulsado 2 segundos para editarlo =====
function abrirLogo() {

$('archivoLogo').addEventListener('change', e => {

(function () {

  ['pointerup', 'pointercancel', 'pointerleave', 'pointermove'].forEach(ev => logo.addEventListener(ev, e => { if (ev !== 'pointermove' || Math.abs(e.movementX) + Math.abs(e.movementY) > 6) parar(); }));
})();

// ===== CÁMARA: al acercar la pala (o cualquier superficie) al objetivo se suma el punto =====
// Se compara cada píxel con cómo se veía antes. Si media pantalla o más cambia de luz de golpe
// (más oscura o más clara, según la pala y el fondo) y se mantiene CAM_TAPADO_MS, cuenta un punto.
// Después hay un descanso (bloqueo compartido con la voz) para no sumar dos veces.
// ==CAM_CORE==
const CAM_W = 32, CAM_H = 24;
const CAM_TAPADO_MS = 200;      // tiempo que debe durar el cambio
const CAM_VENTANA_MS = 450;     // se mira cuánto del cambio de luz ocurrió en este tiempo
const CAM_SUBIDA_RATIO = 0.6;   // la pala entra de golpe: al menos esta parte del cambio total ocurre dentro de la ventana (alguien que pasa o se acerca lo hace más despacio; alguien parado ya no cambia)
const CAM_CALMA_MS = 700;       // la cámara debe estar tranquila este tiempo para volver a armarse
const CAM_CALMA_REL = 0.12;     // "tranquila" = cambio medio de luz por debajo de esto
const CAM_RELEARN_MS = 6000;    // si queda tapada muchísimo rato, se vuelve a aprender la luz normal
// cambio: un píxel cuenta como cambiado si su luz sube o baja más de esa fracción (y al menos 12 niveles)
// cuanto: fracción de píxeles cambiados necesaria
const SENSIBILIDADES = {
  alta:  { cambio: 0.30, cuanto: 0.50 },
  media: { cambio: 0.40, cuanto: 0.60 },
  baja:  { cambio: 0.50, cuanto: 0.75 }
};

function nuevoCam() { return { base: null, desde: 0, armado: true, calmaDesde: 0, hist: [] }; }

// Procesa un fotograma. lum = luz de cada píxel (+1). Devuelve { frac, cubierto, disparo, lento, subida }
function pasoCam(C, lum, ahora, cfg) {
  const n = lum.length;
  if (!C.base) { C.base = Float32Array.from(lum); return { frac: 0, cubierto: false, disparo: false, lento: false, subida: 0 }; }
  let cambiados = 0, rel = 0;
  for (let i = 0; i < n; i++) {
    const dif = Math.abs(lum[i] - C.base[i]);
    if (dif > Math.max(cfg.cambio * C.base[i], 12)) cambiados++;
    rel += Math.min(1, dif / C.base[i]);
  }
  rel /= n;                                                   // cambio medio de luz (continuo)
  const frac = cambiados / n;
  const cubierto = frac >= cfg.cuanto;
  // Rapidez de la entrada: cuánto subió el cambio de luz en los últimos CAM_VENTANA_MS
  C.hist.push({ t: ahora, r: rel });
  while (C.hist.length && ahora - C.hist[0].t > CAM_VENTANA_MS) C.hist.shift();
  let minimo = rel;
  for (const h of C.hist) if (h.r < minimo) minimo = h.r;
  const subida = rel > 0.02 ? (rel - minimo) / rel : 0;      // parte del cambio total que ocurrió dentro de la ventana (0 a 1)
  // Calma: para volver a armarse la cámara debe estar tranquila un rato (evita rebotes al irse alguien)
  if (rel < CAM_CALMA_REL) { if (!C.calmaDesde) C.calmaDesde = ahora; } else C.calmaDesde = 0;
  if (!C.armado && C.calmaDesde && ahora - C.calmaDesde >= CAM_CALMA_MS) C.armado = true;
  let disparo = false, lento = false;
  if (!cubierto) {
    for (let i = 0; i < n; i++) C.base[i] += (lum[i] - C.base[i]) * 0.05;   // sigue los cambios lentos de luz
    C.desde = 0;
  } else {
    if (!C.desde) C.desde = ahora;
    if (C.armado && ahora - C.desde >= CAM_TAPADO_MS) {
      if (subida >= CAM_SUBIDA_RATIO) { C.armado = false; disparo = true; }
      else lento = true;                                      // entró despacio: persona que pasa o se para, no un gesto
    } else if (ahora - C.desde > CAM_RELEARN_MS) { C.base = Float32Array.from(lum); C.desde = 0; C.armado = false; C.calmaDesde = 0; }
  }
  return { frac, cubierto, disparo, lento, subida };
}
// ==/CAM_CORE==

let camActiva = leerLocal('camPadel') !== 'no';
let sens = SENSIBILIDADES[leerLocal('sensPadel')] ? leerLocal('sensPadel') : 'alta';
let camStream = null, camTimer = null, camLum = null, camFlash = null;
let CAM = nuevoCam();
const camCanvas = document.createElement('canvas');
camCanvas.width = CAM_W; camCanvas.height = CAM_H;
const camCtx = camCanvas.getContext('2d', { willReadFrequently: true });

function textoCam(t) { $('camTexto').textContent = t; }

async function iniciarCamara() {
  if (!camActiva || camStream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    textoCam('LA CÁMARA NECESITA HTTPS'); return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } }, audio: false
    });
    const v = $('video');
    v.srcObject = camStream;
    await v.play();
    CAM = nuevoCam();
    camTimer = setInterval(analizarCamara, 50);
    textoCam('ACERCA LA PALA');
  } catch (e) {
    camStream = null;
    textoCam('SIN PERMISO DE CÁMARA · TOCA PARA REINTENTAR');
  }
}

function pararCamara() {
  if (camTimer) { clearInterval(camTimer); camTimer = null; }
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  $('video').srcObject = null;
  CAM = nuevoCam();
  $('camara').classList.remove('tapando');
  $('camNivel').style.width = '0';
}

function analizarCamara() {
  const v = $('video');
  if (v.readyState < 2) return;
  camCtx.drawImage(v, 0, 0, CAM_W, CAM_H);
  const d = camCtx.getImageData(0, 0, CAM_W, CAM_H).data;
  const n = CAM_W * CAM_H;
  if (!camLum) camLum = new Float32Array(n);
  for (let i = 0; i < n; i++) camLum[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2] + 1;
  const r = pasoCam(CAM, camLum, performance.now(), SENSIBILIDADES[sens]);
  $('camNivel').style.width = Math.min(100, Math.round(r.frac * 100)) + '%';
  $('camara').classList.toggle('tapando', r.cubierto && !r.lento);
  $('camara').classList.toggle('ignorado', r.lento);
  if (r.disparo) puntoAuto('cámara');
}

function alternarCamara() {
  camActiva = !camActiva;
  guardarLocal('camPadel', camActiva ? 'si' : 'no');
  if (camActiva) { textoCam('ACTIVANDO CÁMARA...'); iniciarCamara(); }
  else { pararCamara(); textoCam('CÁMARA APAGADA · TOCA PARA ACTIVAR'); }
  pintarMenu();
}

function alternarSens() {
  const orden = ['baja', 'media', 'alta'];
  sens = orden[(orden.indexOf(sens) + 1) % orden.length];
  guardarLocal('sensPadel', sens);
  pintarMenu();
}

$('camara').addEventListener('click', () => {
  if (!camActiva) { camActiva = true; guardarLocal('camPadel', 'si'); pintarMenu(); }
  if (!camStream) { textoCam('ACTIVANDO CÁMARA...'); iniciarCamara(); }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const t = camStream && camStream.getVideoTracks()[0];
  if (camStream && (!t || t.readyState === 'ended')) { pararCamara(); iniciarCamara(); }
});

if (camActiva) iniciarCamara(); else textoCam('CÁMARA APAGADA · TOCA PARA ACTIVAR');


// ===== PUNTO AUTOMÁTICO: bloqueo común (cámara + voz) para no sumar dos veces =====
const AUTO_BLOQUEO_MS = 2000;
let autoBloqueoHasta = 0;

// pareja: a quién suma. Si no se indica, la pareja de este mando (la del lado del mando).
function puntoAuto(origen, pareja) {
  const ahora = performance.now();
  if (ahora < autoBloqueoHasta) return false;
  // No sumar si hay una ventana o el menú abiertos
  if (document.querySelector('.ventana.abierto') || $('fondoMenu').classList.contains('abierto')) return false;
  autoBloqueoHasta = ahora + AUTO_BLOQUEO_MS;
  if (navigator.vibrate) navigator.vibrate(60);
  accionPunto(pareja || parejaActual());
  const c = $('camara');
  c.classList.add('punto');
  textoCam('¡PUNTO!');
  clearTimeout(camFlash);
  camFlash = setTimeout(() => { c.classList.remove('punto'); textoCam(camStream ? 'ACERCA LA PALA' : 'CÁMARA APAGADA · TOCA PARA ACTIVAR'); }, 600);
  return true;
}

// La voz del propio aparato y los avisos que llegan de otro aparato ("anulado", "juego"...) no cuentan
function alHablar() { autoBloqueoHasta = Math.max(autoBloqueoHasta, performance.now() + 3500); }
function alRecibir() { autoBloqueoHasta = Math.max(autoBloqueoHasta, performance.now() + 2500); }

// ===== MICRÓFONO: una pareja dice "punto" y la otra dice "tanto" =====
// La pareja del lado de este mando dice "punto" (letra P junto a sus nombres); la del otro lado dice "tanto" (letra T).
// Así no hace falta adivinar quién habla por el volumen: cada palabra suma a su pareja.
// Usa el reconocimiento de voz del navegador (Chrome). Con cada frase se muestra lo que ha oído.
let micActivo = false, micRec = null, micSesion = 0, micContadas = {}, micTextoAviso = null, micErrores = 0;

function avisoMic(t, ms) {
  const a = $('avisoMic');
  a.textContent = t; a.classList.add('on');
  clearTimeout(micTextoAviso);
  micTextoAviso = setTimeout(() => a.classList.remove('on'), ms || 2200);
}

function pintarMic() {
  $('botonMic').classList.toggle('on', micActivo);
  $('botonMic').setAttribute('aria-pressed', micActivo ? 'true' : 'false');
}

// Qué dice cada pareja ahora mismo
function palabraDe(pareja) { return pareja === parejaActual() ? 'punto' : 'tanto'; }

function oirPalabra(palabra, clave) {
  if (micContadas[clave]) return;           // una frase cuenta una sola vez aunque llegue en trozos
  micContadas[clave] = true;
  const mia = parejaActual();
  const pareja = palabra === 'punto' ? mia : otro(mia);
  puntoAuto('voz', pareja);
}

function arrancarReconocimiento() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { avisoMic('ESTE NAVEGADOR NO ENTIENDE VOZ · USA CHROME', 4000); micActivo = false; guardarLocal('micPadel', 'no'); pintarMic(); return false; }
  const sesion = ++micSesion;
  micContadas = {};
  micRec = new SR();
  micRec.lang = 'es-ES';
  micRec.continuous = true;
  micRec.interimResults = true;
  micRec.maxAlternatives = 3;
  micRec.onstart = () => { micErrores = 0; };
  micRec.onresult = ev => {
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      let texto = '';
      for (let k = 0; k < ev.results[i].length; k++) texto += ' ' + (ev.results[i][k].transcript || '');
      texto = texto.toLowerCase();
      const oido = (ev.results[i][0].transcript || '').trim();
      if (/anulad/.test(texto)) continue;
      // Chrome a veces escribe la palabra "punto" como el signo "." : se acepta si lo único oído es ese signo
      const soloSigno = /^[\s.]*\.[\s.]*$/.test(oido);
      const hayPunto = /\bpunto\b/.test(texto) || soloSigno, hayTanto = /\btanto\b/.test(texto);
      if (hayPunto && hayTanto) continue;   // confuso: no se suma a nadie
      // Solo se muestra la palabra clave, nunca el resto de lo que se oye
      if (hayPunto) { if (!micContadas[sesion + ':' + i + ':p']) avisoMic('PUNTO', 1200); oirPalabra('punto', sesion + ':' + i + ':p'); }
      else if (hayTanto) { if (!micContadas[sesion + ':' + i + ':t']) avisoMic('TANTO', 1200); oirPalabra('tanto', sesion + ':' + i + ':t'); }
    }
  };
  micRec.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      avisoMic('SIN PERMISO DE MICRÓFONO · ACTÍVALO EN LOS AJUSTES DEL SITIO', 4500);
      micActivo = false; guardarLocal('micPadel', 'no'); pintarMic();
    } else if (ev.error === 'audio-capture') {
      avisoMic('NO SE ENCUENTRA EL MICRÓFONO', 3500);
    } else if (ev.error === 'network') {
      avisoMic('EL RECONOCIMIENTO DE VOZ NECESITA INTERNET', 3500);
    }
    micErrores++;
  };
  micRec.onend = () => {                     // Chrome corta el reconocimiento tras un silencio: se reanuda solo
    if (micActivo && sesion === micSesion) setTimeout(() => { if (micActivo) arrancarReconocimiento(); }, micErrores > 3 ? 1500 : 250);
  };
  try { micRec.start(); } catch (e) {}
  return true;
}

function activarMic() {
  micActivo = true;
  guardarLocal('micPadel', 'si');
  pintarMic();
  if (!arrancarReconocimiento()) return;
  avisoMic('MICRÓFONO ACTIVO · DI "PUNTO" O "TANTO"', 2600);
}

function desactivarMic() {
  micActivo = false;
  guardarLocal('micPadel', 'no');
  micSesion++;
  if (micRec) { try { micRec.onend = null; micRec.abort(); } catch (e) {} micRec = null; }
  pintarMic();
  avisoMic('MICRÓFONO APAGADO');
}

function alternarMic() { micActivo ? desactivarMic() : activarMic(); }

// El micrófono empieza apagado: el navegador exige un toque del usuario para dar permiso
pintarMic();


$('mas').addEventListener('click', () => {
  if (navigator.vibrate) navigator.vibrate(60);
  accionPunto(parejaActual());
});
$('menos').addEventListener('click', () => {
  if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
  deshacer();
});

iniciarMotor();
</script>
